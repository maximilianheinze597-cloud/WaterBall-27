<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>WATERBALL 27</title>

  <script src="https://cdn.jsdelivr.net/npm/phaser@4.0.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06141d;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06141d;
      color: white;
      font-size: 24px;
      font-weight: 800;
      z-index: 99;
    }
  </style>
</head>

<body>
  <div id="loading">WATERBALL 27</div>
  <div id="game"></div>

<script>
"use strict";

/* =========================================================
   WATERBALL 27
   Browser water-polo game
   ========================================================= */

const GAME_W = 1280;
const GAME_H = 720;

const FIELD = {
  x: 90,
  y: 90,
  w: 1100,
  h: 540,
  goalDepth: 55,
  goalH: 170
};

const GOAL_Y = GAME_H / 2;

let game;
let scene;

/* =========================================================
   GAME STATE
   ========================================================= */

const state = {
  scoreHome: 0,
  scoreAway: 0,

  matchSeconds: 5 * 60,
  attackSeconds: 25,

  paused: false,
  goalPause: 0,

  activePlayer: 5,

  sprint: false,
  sprintEnergy: 100,
  sprintCooldown: 0,

  shootCharging: false,
  shootPower: 0,

  lastAction: "READY"
};

/* =========================================================
   PLAYERS
   ========================================================= */

const players = [];

const HOME = [
  { id: 0, role: "GK", x: 130, y: 360, color: 0xffd84d },
  { id: 1, role: "LB", x: 290, y: 220, color: 0x168cff },
  { id: 2, role: "CB", x: 330, y: 360, color: 0x168cff },
  { id: 3, role: "RB", x: 290, y: 500, color: 0x168cff },
  { id: 4, role: "LW", x: 520, y: 230, color: 0x168cff },
  { id: 5, role: "CF", x: 570, y: 360, color: 0x168cff },
  { id: 6, role: "RW", x: 520, y: 490, color: 0x168cff }
];

const AWAY = [
  { id: 7, role: "GK", x: 1150, y: 360, color: 0xff6464 },
  { id: 8, role: "LB", x: 990, y: 220, color: 0xff4444 },
  { id: 9, role: "CB", x: 950, y: 360, color: 0xff4444 },
  { id: 10, role: "RB", x: 990, y: 500, color: 0xff4444 },
  { id: 11, role: "LW", x: 760, y: 230, color: 0xff4444 },
  { id: 12, role: "CF", x: 710, y: 360, color: 0xff4444 },
  { id: 13, role: "RW", x: 760, y: 490, color: 0xff4444 }
];

function createPlayers() {
  players.length = 0;

  [...HOME, ...AWAY].forEach((p, index) => {
    players.push({
      id: p.id,
      role: p.role,
      team: index < 7 ? "home" : "away",

      x: p.x,
      y: p.y,

      homeX: p.x,
      homeY: p.y,

      vx: 0,
      vy: 0,

      speed: 145,
      stamina: 100,

      tackleCooldown: 0,

      hasBall: false,

      color: p.color,

      number:
        p.id === 5
          ? 6
          : (p.id % 7) + 1,

      name:
        p.id === 5
          ? "MAX HEINZE"
          : index < 7
            ? "LOK"
            : "GUEST"
    });
  });
}

/* =========================================================
   BALL
   ========================================================= */

const ball = {
  x: 640,
  y: 360,

  vx: 0,
  vy: 0,

  mode: "held",
  ownerId: 5,
  targetId: null,

  team: "home",

  previousX: 640,
  previousY: 360,

  shotTeam: null
};

function playerById(id) {
  return players.find(p => p.id === id);
}

function clearBallOwners() {
  players.forEach(p => p.hasBall = false);
}

function giveBall(player) {
  if (!player) return;

  clearBallOwners();

  player.hasBall = true;

  ball.ownerId = player.id;
  ball.mode = "held";
  ball.targetId = null;
  ball.team = player.team;
  ball.vx = 0;
  ball.vy = 0;

  state.attackSeconds = 25;

  state.lastAction =
    player.team === "home"
      ? "BALLBESITZ"
      : "BALLVERLUST";
}

function releaseBall() {
  const owner = playerById(ball.ownerId);

  if (owner) {
    owner.hasBall = false;
  }

  ball.ownerId = null;
}

/* =========================================================
   PHASER SCENE
   ========================================================= */

class WaterBallScene extends Phaser.Scene {

  constructor() {
    super("WaterBallScene");
  }

  preload() {}

  create() {
    scene = this;

    this.createBackground();
    this.createField();
    this.createGoals();

    createPlayers();

    this.playerGraphics = [];
    this.createPlayerGraphics();

    this.ballGraphic = this.add.circle(
      ball.x,
      ball.y,
      11,
      0xffffff
    );

    this.ballGraphic.setStrokeStyle(3, 0x17384d);

    this.createHUD();
    this.createControls();

    this.setupInput();

    this.resetKickoff();

    document.getElementById("loading").style.display = "none";
  }

  update(time, delta) {
    const dt = Math.min(delta / 1000, 0.033);

    if (state.paused) {
      this.renderEverything();
      return;
    }

    if (state.goalPause > 0) {
      state.goalPause -= dt;

      this.renderEverything();

      if (state.goalPause <= 0) {
        this.resetKickoff();
      }

      return;
    }

    updateMatchClock(dt);
    updateSprint(dt);
    updatePlayerMovement(dt);
    updateAI(dt);
    updateBall(dt);
    updatePlayerSwitch();

    this.renderEverything();
  }

  /* =======================================================
     BACKGROUND
     ======================================================= */

  createBackground() {
    const g = this.add.graphics();

    g.fillStyle(0x071c27);
    g.fillRect(0, 0, GAME_W, GAME_H);

    g.fillStyle(0x0b3444);
    g.fillRect(0, 0, GAME_W, 70);

    g.fillStyle(0x051219);
    g.fillRect(0, 650, GAME_W, 70);
  }

  /* =======================================================
     FIELD
     ======================================================= */

  createField() {
    const g = this.add.graphics();

    g.fillStyle(0x087da5);
    g.fillRoundedRect(
      FIELD.x,
      FIELD.y,
      FIELD.w,
      FIELD.h,
      20
    );

    /* water stripes */
    g.lineStyle(2, 0x1c9fc2, 0.45);

    for (let y = FIELD.y + 20; y < FIELD.y + FIELD.h; y += 25) {
      g.beginPath();
      g.moveTo(FIELD.x, y);
      g.lineTo(FIELD.x + FIELD.w, y);
      g.strokePath();
    }

    /* boundary */
    g.lineStyle(5, 0xffffff, 0.9);

    g.strokeRoundedRect(
      FIELD.x,
      FIELD.y,
      FIELD.w,
      FIELD.h,
      20
    );

    /* center */
    g.lineStyle(4, 0xffffff, 0.7);

    g.lineBetween(
      GAME_W / 2,
      FIELD.y,
      GAME_W / 2,
      FIELD.y + FIELD.h
    );

    g.strokeCircle(
      GAME_W / 2,
      GAME_H / 2,
      75
    );

    /* 2m lines */
    g.lineStyle(5, 0xfff06a, 0.9);

    g.lineBetween(
      FIELD.x + 120,
      FIELD.y,
      FIELD.x + 120,
      FIELD.y + FIELD.h
    );

    g.lineBetween(
      FIELD.x + FIELD.w - 120,
      FIELD.y,
      FIELD.x + FIELD.w - 120,
      FIELD.y + FIELD.h
    );

    /* 5m lines */
    g.lineStyle(5, 0xff5555, 0.9);

    g.lineBetween(
      FIELD.x + 280,
      FIELD.y,
      FIELD.x + 280,
      FIELD.y + FIELD.h
    );

    g.lineBetween(
      FIELD.x + FIELD.w - 280,
      FIELD.y,
      FIELD.x + FIELD.w - 280,
      FIELD.y + FIELD.h
    );
  }

  /* =======================================================
     GOALS
     ======================================================= */

  createGoals() {
    const g = this.add.graphics();

    const top = GOAL_Y - FIELD.goalH / 2;
    const bottom = GOAL_Y + FIELD.goalH / 2;

    /* left goal */
    g.fillStyle(0xffffff, 0.15);
    g.fillRect(
      FIELD.x - FIELD.goalDepth,
      top,
      FIELD.goalDepth,
      FIELD.goalH
    );

    g.lineStyle(7, 0xffffff);

    g.strokeRect(
      FIELD.x - FIELD.goalDepth,
      top,
      FIELD.goalDepth,
      FIELD.goalH
    );

    /* right goal */
    g.fillStyle(0xffffff, 0.15);

    g.fillRect(
      FIELD.x + FIELD.w,
      top,
      FIELD.goalDepth,
      FIELD.goalH
    );

    g.strokeRect(
      FIELD.x + FIELD.w,
      top,
      FIELD.goalDepth,
      FIELD.goalH
    );
  }

  /* =======================================================
     PLAYER GRAPHICS
     ======================================================= */

  createPlayerGraphics() {
    players.forEach(p => {
      const container = this.add.container(p.x, p.y);

      const body = this.add.circle(
        0,
        0,
        22,
        p.color
      );

      body.setStrokeStyle(3, 0xffffff, 0.9);

      const cap = this.add.circle(
        0,
        -13,
        9,
        p.team === "home"
          ? 0x0b55a0
          : 0xa91515
      );

      const number = this.add.text(
        0,
        2,
        String(p.number),
        {
          fontFamily: "Arial",
          fontSize: "16px",
          fontStyle: "bold",
          color: "#ffffff"
        }
      );

      number.setOrigin(0.5);

      const role = this.add.text(
        0,
        36,
        p.role,
        {
          fontFamily: "Arial",
          fontSize: "12px",
          fontStyle: "bold",
          color: "#ffffff"
        }
      );

      role.setOrigin(0.5);

      container.add([
        body,
        cap,
        number,
        role
      ]);

      this.playerGraphics.push({
        container,
        body
      });
    });
  }

  /* =======================================================
     HUD
     ======================================================= */

  createHUD() {
    this.scoreText = this.add.text(
      GAME_W / 2,
      25,
      "LOK 0 : 0 GUEST",
      {
        fontFamily: "Arial",
        fontSize: "28px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    this.scoreText.setOrigin(0.5);

    this.timeText = this.add.text(
      GAME_W / 2,
      57,
      "05:00",
      {
        fontFamily: "Arial",
        fontSize: "18px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    this.timeText.setOrigin(0.5);

    this.attackText = this.add.text(
      GAME_W - 130,
      28,
      "ATTACK 25",
      {
        fontFamily: "Arial",
        fontSize: "17px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    this.statusText = this.add.text(
      30,
      25,
      "MAX HEINZE #6",
      {
        fontFamily: "Arial",
        fontSize: "17px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    this.actionText = this.add.text(
      GAME_W / 2,
      680,
      "",
      {
        fontFamily: "Arial",
        fontSize: "18px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    this.actionText.setOrigin(0.5);
  }

  /* =======================================================
     CONTROLS
     ======================================================= */

  createControls() {
    this.controls = {};

    /* joystick */
    this.joyBase = this.add.circle(
      125,
      560,
      70,
      0x06141d,
      0.7
    );

    this.joyBase.setStrokeStyle(4, 0xffffff, 0.4);

    this.joyKnob = this.add.circle(
      125,
      560,
      30,
      0xffffff,
      0.7
    );

    /* action buttons */

    this.controls.pass = this.createButton(
      1060,
      535,
      58,
      "PASS"
    );

    this.controls.shoot = this.createButton(
      1160,
      470,
      64,
      "WURF"
    );

    this.controls.sprint = this.createButton(
      1060,
      620,
      58,
      "SPRINT"
    );

    this.controls.switch = this.createButton(
      1160,
      590,
      58,
      "SWITCH"
    );

    this.controls.steal = this.createButton(
      950,
      620,
      58,
      "STEAL"
    );
  }

  createButton(x, y, r, label) {
    const circle = this.add.circle(
      x,
      y,
      r,
      0x06141d,
      0.75
    );

    circle.setStrokeStyle(
      3,
      0xffffff,
      0.5
    );

    const text = this.add.text(
      x,
      y,
      label,
      {
        fontFamily: "Arial",
        fontSize: label.length > 5 ? "11px" : "14px",
        fontStyle: "bold",
        color: "#ffffff"
      }
    );

    text.setOrigin(0.5);

    return {
      circle,
      text,
      down: false
    };
  }

  /* =======================================================
     INPUT
     ======================================================= */

  setupInput() {
    this.input.addPointer(4);

    let joyPointer = null;

    this.input.on(
      "pointerdown",
      pointer => {

        const x = pointer.x;
        const y = pointer.y;

        /* joystick */
        if (
          Phaser.Math.Distance.Between(
            x,
            y,
            this.joyBase.x,
            this.joyBase.y
          ) < 90
        ) {
          joyPointer = pointer.id;
          updateJoystick(pointer);
          return;
        }

        /* buttons */

        if (insideButton(pointer, this.controls.pass)) {
          passBall();
          return;
        }

        if (insideButton(pointer, this.controls.shoot)) {
          state.shootCharging = true;
          state.shootPower = 0;
          return;
        }

        if (insideButton(pointer, this.controls.sprint)) {
          state.sprint = true;
          return;
        }

        if (insideButton(pointer, this.controls.switch)) {
          switchPlayer();
          return;
        }

        if (insideButton(pointer, this.controls.steal)) {
          stealBall();
        }
      }
    );

    this.input.on(
      "pointermove",
      pointer => {
        if (pointer.id === joyPointer) {
          updateJoystick(pointer);
        }
      }
    );

    this.input.on(
      "pointerup",
      pointer => {

        if (pointer.id === joyPointer) {
          joyPointer = null;

          input.moveX = 0;
          input.moveY = 0;

          this.joyKnob.setPosition(
            this.joyBase.x,
            this.joyBase.y
          );
        }

        if (insideButton(pointer, this.controls.shoot)) {
          if (state.shootCharging) {
            shootBall();
          }

          state.shootCharging = false;
        }

        if (insideButton(pointer, this.controls.sprint)) {
          state.sprint = false;
        }
      }
    );

    this.input.on(
      "pointercancel",
      pointer => {
        if (pointer.id === joyPointer) {
          joyPointer = null;

          input.moveX = 0;
          input.moveY = 0;

          this.joyKnob.setPosition(
            this.joyBase.x,
            this.joyBase.y
          );
        }

        state.sprint = false;
        state.shootCharging = false;
      }
    );

    /* keyboard fallback */
    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      pass: Phaser.Input.Keyboard.KeyCodes.E,
      shoot: Phaser.Input.Keyboard.KeyCodes.SPACE,
      sprint: Phaser.Input.Keyboard.KeyCodes.SHIFT,
      steal: Phaser.Input.Keyboard.KeyCodes.F,
      switch: Phaser.Input.Keyboard.KeyCodes.Q
    });

    this.input.keyboard.on(
      "keydown-E",
      () => passBall()
    );

    this.input.keyboard.on(
      "keydown-Q",
      () => switchPlayer()
    );

    this.input.keyboard.on(
      "keydown-F",
      () => stealBall()
    );
  }

  /* =======================================================
     RENDER
     ======================================================= */

  renderEverything() {
    players.forEach((p, i) => {
      const g = this.playerGraphics[i];

      g.container.setPosition(
        p.x,
        p.y
      );

      const active =
        p.id === players[state.activePlayer].id;

      g.body.setStrokeStyle(
        active ? 5 : 3,
        active ? 0xffff00 : 0xffffff,
        1
      );
    });

    this.ballGraphic.setPosition(
      ball.x,
      ball.y
    );

    this.scoreText.setText(
      `LOK ${state.scoreHome} : ${state.scoreAway} GUEST`
    );

    this.timeText.setText(
      formatTime(state.matchSeconds)
    );

    this.attackText.setText(
      `ATTACK ${Math.ceil(state.attackSeconds)}`
    );

    const active =
      players[state.activePlayer];

    this.statusText.setText(
      `${active.name} #${active.number} • ${active.role}`
    );

    this.actionText.setText(
      state.lastAction
    );

    if (state.shootCharging) {
      this.actionText.setText(
        `WURF: ${Math.round(state.shootPower * 100)}%`
      );
    }
  }
}

/* =========================================================
   INPUT
   ========================================================= */

const input = {
  moveX: 0,
  moveY: 0
};

function updateJoystick(pointer) {
  const dx =
    pointer.x - scene.joyBase.x;

  const dy =
    pointer.y - scene.joyBase.y;

  const length =
    Math.sqrt(dx * dx + dy * dy);

  const max = 55;

  let nx = dx;
  let ny = dy;

  if (length > max) {
    nx = dx / length * max;
    ny = dy / length * max;
  }

  scene.joyKnob.setPosition(
    scene.joyBase.x + nx,
    scene.joyBase.y + ny
  );

  input.moveX = nx / max;
  input.moveY = ny / max;
}

function insideButton(pointer, button) {
  return Phaser.Math.Distance.Between(
    pointer.x,
    pointer.y,
    button.circle.x,
    button.circle.y
  ) <= button.circle.radius + 12;
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function updatePlayerMovement(dt) {
  const active =
    players[state.activePlayer];

  if (!active) return;

  let mx = input.moveX;
  let my = input.moveY;

  if (scene.keys) {
    if (scene.keys.left.isDown) mx -= 1;
    if (scene.keys.right.isDown) mx += 1;
    if (scene.keys.up.isDown) my -= 1;
    if (scene.keys.down.isDown) my += 1;
  }

  const length =
    Math.sqrt(mx * mx + my * my);

  if (length > 1) {
    mx /= length;
    my /= length;
  }

  const sprinting =
    state.sprint &&
    state.sprintEnergy > 0 &&
    state.sprintCooldown <= 0;

  const speed =
    active.speed *
    (sprinting ? 1.65 : 1);

  active.vx = mx * speed;
  active.vy = my * speed;

  active.x += active.vx * dt;
  active.y += active.vy * dt;

  active.x = Phaser.Math.Clamp(
    active.x,
    FIELD.x + 20,
    FIELD.x + FIELD.w - 20
  );

  active.y = Phaser.Math.Clamp(
    active.y,
    FIELD.y + 20,
    FIELD.y + FIELD.h - 20
  );

  if (state.shootCharging) {
    state.shootPower = Math.min(
      1,
      state.shootPower + dt * 0.9
    );
  }
}

/* =========================================================
   SPRINT
   ========================================================= */

function updateSprint(dt) {
  if (
    state.sprint &&
    state.sprintEnergy > 0 &&
    state.sprintCooldown <= 0
  ) {
    state.sprintEnergy -= 38 * dt;

    if (state.sprintEnergy <= 0) {
      state.sprintEnergy = 0;
      state.sprint = false;
      state.sprintCooldown = 2;
    }
  } else {
    state.sprintEnergy += 20 * dt;

    if (!state.sprint) {
      state.sprintCooldown -= dt;
    }
  }

  state.sprintEnergy =
    Phaser.Math.Clamp(
      state.sprintEnergy,
      0,
      100
    );
}

/* =========================================================
   MATCH CLOCK
   ========================================================= */

function updateMatchClock(dt) {
  state.matchSeconds -= dt;

  if (state.matchSeconds <= 0) {
    state.matchSeconds = 0;
    state.paused = true;
    state.lastAction = "FULL TIME";
  }

  if (ball.team) {
    state.attackSeconds -= dt;

    if (state.attackSeconds <= 0) {
      state.attackSeconds = 25;

      const newPlayer =
        players.find(
          p =>
            p.team !== ball.team &&
            p.role === "CB"
        );

      if (newPlayer) {
        giveBall(newPlayer);
      }

      state.lastAction = "ANGRIFFSZEIT ABGELAUFEN";
    }
  }
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));

  const m =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");

  const s =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${m}:${s}`;
}

/* =========================================================
   PASS
   ========================================================= */

function passBall() {
  const active =
    players[state.activePlayer];

  if (!active || ball.ownerId !== active.id) {
    state.lastAction = "KEIN BALL";
    return;
  }

  let target = null;

  let bestScore = -Infinity;

  players.forEach(p => {
    if (
      p.team !== active.team ||
      p.id === active.id ||
      p.role === "GK"
    ) {
      return;
    }

    const dx = p.x - active.x;
    const dy = p.y - active.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);

    if (distance > 430) return;

    let score = 500 - distance;

    if (
      active.team === "home" &&
      p.x > active.x
    ) {
      score += 120;
    }

    if (
      active.team === "away" &&
      p.x < active.x
    ) {
      score += 120;
    }

    if (score > bestScore) {
      bestScore = score;
      target = p;
    }
  });

  if (!target) {
    state.lastAction = "KEIN PASSZIEL";
    return;
  }

  releaseBall();

  ball.mode = "pass";
  ball.targetId = target.id;
  ball.team = active.team;

  const dx = target.x - active.x;
  const dy = target.y - active.y;

  const distance =
    Math.sqrt(dx * dx + dy * dy);

  const speed = 720;

  ball.vx = dx / distance * speed;
  ball.vy = dy / distance * speed;

  ball.x = active.x;
  ball.y = active.y;

  state.lastAction =
    `PASS → ${target.role}`;
}

/* =========================================================
   SHOOT
   ========================================================= */

function shootBall() {
  const active =
    players[state.activePlayer];

  if (!active || ball.ownerId !== active.id) {
    state.lastAction = "KEIN BALL";
    return;
  }

  const power =
    0.65 +
    state.shootPower * 0.75;

  releaseBall();

  ball.mode = "shot";
  ball.shotTeam = active.team;
  ball.team = active.team;

  const goalX =
    active.team === "home"
      ? FIELD.x + FIELD.w + FIELD.goalDepth
      : FIELD.x - FIELD.goalDepth;

  const aimY =
    GOAL_Y +
    input.moveY * 65;

  const dx =
    goalX - active.x;

  const dy =
    aimY - active.y;

  const distance =
    Math.sqrt(dx * dx + dy * dy);

  const speed =
    650 + 250 * power;

  ball.vx =
    dx / distance * speed;

  ball.vy =
    dy / distance * speed;

  ball.x = active.x;
  ball.y = active.y;

  state.lastAction =
    `WURF ${Math.round(power * 100)}%`;
}

/* =========================================================
   BALL
   ========================================================= */

function updateBall(dt) {
  ball.previousX = ball.x;
  ball.previousY = ball.y;

  if (ball.mode === "held") {
    const owner =
      playerById(ball.ownerId);

    if (!owner) {
      ball.mode = "loose";
      ball.ownerId = null;
      return;
    }

    const facing =
      input.moveX !== 0 ||
      input.moveY !== 0
        ? {
            x: input.moveX,
            y: input.moveY
          }
        : {
            x: owner.team === "home" ? 1 : -1,
            y: 0
          };

    ball.x =
      owner.x + facing.x * 28;

    ball.y =
      owner.y + facing.y * 28;

    return;
  }

  if (
    ball.mode === "pass" ||
    ball.mode === "shot"
  ) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.mode === "pass") {
      checkPassInterception();

      const target =
        playerById(ball.targetId);

      if (
        target &&
        Phaser.Math.Distance.Between(
          ball.x,
          ball.y,
          target.x,
          target.y
        ) < 32
      ) {
        giveBall(target);
        state.lastAction =
          `${target.role} ANNAHME`;
        return;
      }
    }

    if (ball.mode === "shot") {
      checkGoalkeeperSave();

      if (checkGoal()) {
        return;
      }
    }

    if (
      ball.x < FIELD.x - 100 ||
      ball.x > FIELD.x + FIELD.w + 100 ||
      ball.y < FIELD.y - 100 ||
      ball.y > FIELD.y + FIELD.h + 100
    ) {
      ball.mode = "loose";
      ball.vx *= 0.3;
      ball.vy *= 0.3;
    }

    return;
  }

  if (ball.mode === "loose") {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.vx *= Math.pow(0.15, dt);
    ball.vy *= Math.pow(0.15, dt);

    const closest =
      getClosestPlayerToBall();

    if (
      closest &&
      Math.sqrt(
        ball.vx * ball.vx +
        ball.vy * ball.vy
      ) < 220 &&
      Phaser.Math.Distance.Between(
        ball.x,
        ball.y,
        closest.x,
        closest.y
      ) < 28
    ) {
      giveBall(closest);
    }
  }
}

/* =========================================================
   PASS INTERCEPTION
   ========================================================= */

function checkPassInterception() {
  const target =
    playerById(ball.targetId);

  if (!target) return;

  for (const defender of players) {
    if (defender.team === ball.team) continue;

    const distance =
      pointSegmentDistance(
        defender.x,
        defender.y,
        ball.previousX,
        ball.previousY,
        ball.x,
        ball.y
      );

    if (distance < 25) {
      giveBall(defender);

      state.lastAction =
        "PASS ABGEFANGEN";

      return;
    }
  }
}

/* =========================================================
   GOALKEEPER
   ========================================================= */

function checkGoalkeeperSave() {
  if (ball.mode !== "shot") return;

  const keeper =
    ball.shotTeam === "home"
      ? playerById(7)
      : playerById(0);

  if (!keeper) return;

  const distance =
    pointSegmentDistance(
      keeper.x,
      keeper.y,
      ball.previousX,
      ball.previousY,
      ball.x,
      ball.y
    );

  if (distance < 48) {
    ball.mode = "loose";

    ball.vx *= -0.35;
    ball.vy *= 0.35;

    state.lastAction =
      "TORWART PARIERT";

    return;
  }
}

/* =========================================================
   GOALS
   ========================================================= */

function checkGoal() {
  const top =
    GOAL_Y - FIELD.goalH / 2;

  const bottom =
    GOAL_Y + FIELD.goalH / 2;

  if (
    ball.x >= FIELD.x + FIELD.w &&
    ball.previousX < FIELD.x + FIELD.w &&
    ball.y > top &&
    ball.y < bottom &&
    ball.shotTeam === "home"
  ) {
    scoreGoal("home");
    return true;
  }

  if (
    ball.x <= FIELD.x &&
    ball.previousX > FIELD.x &&
    ball.y > top &&
    ball.y < bottom &&
    ball.shotTeam === "away"
  ) {
    scoreGoal("away");
    return true;
  }

  return false;
}

function scoreGoal(team) {
  if (team === "home") {
    state.scoreHome++;
  } else {
    state.scoreAway++;
  }

  state.goalPause = 1.4;
  state.lastAction =
    team === "home"
      ? "⚽ TOR LOK!"
      : "⚽ TOR GUEST!";

  releaseBall();

  ball.mode = "loose";
  ball.vx = 0;
  ball.vy = 0;
}

/* =========================================================
   STEAL
   ========================================================= */

function stealBall() {
  const active =
    players[state.activePlayer];

  if (!active) return;

  if (ball.ownerId === active.id) {
    state.lastAction = "DU HAST DEN BALL";
    return;
  }

  const owner =
    playerById(ball.ownerId);

  if (!owner) {
    state.lastAction = "KEIN GEGNER MIT BALL";
    return;
  }

  if (owner.team === active.team) return;

  const distance =
    Phaser.Math.Distance.Between(
      active.x,
      active.y,
      owner.x,
      owner.y
    );

  if (distance < 75) {
    giveBall(active);

    state.lastAction =
      "BALL ERKÄMPFT!";
  } else {
    state.lastAction =
      "ZU WEIT FÜR STEAL";
  }
}

/* =========================================================
   AI
   ========================================================= */

function updateAI(dt) {
  players.forEach(p => {

    if (p.id === players[state.activePlayer].id) {
      return;
    }

    p.tackleCooldown -= dt;

    const target =
      getAITarget(p);

    if (!target) return;

    const dx =
      target.x - p.x;

    const dy =
      target.y - p.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);

    if (distance > 3) {
      const speed =
        p.role === "GK"
          ? 110
          : 125;

      p.x +=
        dx / distance *
        speed *
        dt;

      p.y +=
        dy / distance *
        speed *
        dt;
    }

    p.x = Phaser.Math.Clamp(
      p.x,
      FIELD.x + 15,
      FIELD.x + FIELD.w - 15
    );

    p.y = Phaser.Math.Clamp(
      p.y,
      FIELD.y + 15,
      FIELD.y + FIELD.h - 15
    );

    /* AI steal */
    if (
      ball.ownerId &&
      ball.ownerId !== p.id
    ) {
      const owner =
        playerById(ball.ownerId);

      if (
        owner &&
        owner.team !== p.team &&
        p.tackleCooldown <= 0 &&
        Phaser.Math.Distance.Between(
          p.x,
          p.y,
          owner.x,
          owner.y
        ) < 48
      ) {
        giveBall(p);

        p.tackleCooldown = 2;

        state.lastAction =
          "GEGNER EROBERT BALL";
      }
    }
  });
}

function getAITarget(p) {
  const owner =
    playerById(ball.ownerId);

  /* ball carrier */
  if (owner && owner.id === p.id) {
    return {
      x:
        p.team === "home"
          ? FIELD.x + FIELD.w - 80
          : FIELD.x + 80,

      y:
        GOAL_Y
    };
  }

  /* opponent has ball */
  if (
    owner &&
    owner.team !== p.team
  ) {
    const distance =
      Phaser.Math.Distance.Between(
        p.x,
        p.y,
        owner.x,
        owner.y
      );

    if (
      distance < 450 &&
      p.role !== "GK"
    ) {
      return owner;
    }
  }

  /* ball in flight */
  if (
    ball.mode === "pass" ||
    ball.mode === "shot" ||
    ball.mode === "loose"
  ) {
    if (
      p.role !== "GK" ||
      ball.mode !== "shot"
    ) {
      return {
        x: ball.x,
        y: ball.y
      };
    }
  }

  /* formation */
  let tx = p.homeX;
  let ty = p.homeY;

  if (ball.ownerId) {
    const owner =
      playerById(ball.ownerId);

    if (owner) {
      const direction =
        p.team === "home" ? 1 : -1;

      tx +=
        (owner.x - GAME_W / 2) *
        0.12 *
        direction;

      ty +=
        (owner.y - GOAL_Y) *
        0.08;
    }
  }

  return {
    x: tx,
    y: ty
  };
}

/* =========================================================
   PLAYER SWITCH
   ========================================================= */

function updatePlayerSwitch() {}

function switchPlayer() {
  const active =
    players[state.activePlayer];

  const candidates =
    players.filter(
      p =>
        p.team === "home" &&
        p.id !== active.id &&
        p.role !== "GK"
    );

  let best = null;
  let bestDistance = Infinity;

  candidates.forEach(p => {
    const d =
      Phaser.Math.Distance.Between(
        p.x,
        p.y,
        ball.x,
        ball.y
      );

    if (d < bestDistance) {
      bestDistance = d;
      best = p;
    }
  });

  if (best) {
    state.activePlayer =
      players.findIndex(
        p => p.id === best.id
      );

    state.lastAction =
      `SPIELER → ${best.role}`;
  }
}

/* =========================================================
   KICKOFF
   ========================================================= */

function resetKickoff() {
  createPlayers();

  state.activePlayer = 5;

  const cf =
    playerById(5);

  giveBall(cf);

  ball.x = cf.x;
  ball.y = cf.y;

  ball.shotTeam = null;

  state.goalPause = 0;
  state.attackSeconds = 25;
}

/* =========================================================
   GEOMETRY
   ========================================================= */

function pointSegmentDistance(
  px,
  py,
  x1,
  y1,
  x2,
  y2
) {
  const dx = x2 - x1;
  const dy = y2 - y1;

  if (dx === 0 && dy === 0) {
    return Phaser.Math.Distance.Between(
      px,
      py,
      x1,
      y1
    );
  }

  const t =
    Phaser.Math.Clamp(
      (
        (px - x1) * dx +
        (py - y1) * dy
      ) /
      (dx * dx + dy * dy),
      0,
      1
    );

  const x =
    x1 + t * dx;

  const y =
    y1 + t * dy;

  return Phaser.Math.Distance.Between(
    px,
    py,
    x,
    y
  );
}

function getClosestPlayerToBall() {
  let closest = null;
  let distance = Infinity;

  players.forEach(p => {
    const d =
      Phaser.Math.Distance.Between(
        p.x,
        p.y,
        ball.x,
        ball.y
      );

    if (d < distance) {
      distance = d;
      closest = p;
    }
  });

  return closest;
}

   PHASER CONFIG
   ========================================================= */

const config = {
  type: Phaser.AUTO,

  parent: "game",

  width: GAME_W,
  height: GAME_H,

    autoCenter: Phaser.Scale.CENTER_BOTH,

    height: GAME_H
  },

  render: {
    antialias: true,
    pixelArt: false
  },

  input: {
    activePointers: 5
  },

  scene: [
    WaterBallScene
  ]
};

game = new Phaser.Game(config);
