<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>WATERBALL 27</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #087da5;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #status {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="status">WATERBALL 27<br><small>GAME LOADED ✅</small></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

function draw() {

  ctx.clearRect(0, 0, W, H);

  /* Wasser */
  ctx.fillStyle = "#087da5";
  ctx.fillRect(0, 0, W, H);

  /* Spielfeld */
  const marginX = W * 0.08;
  const marginY = H * 0.13;

  const fieldX = marginX;
  const fieldY = marginY;
  const fieldW = W - marginX * 2;
  const fieldH = H - marginY * 2;

  ctx.fillStyle = "#08769a";
  ctx.fillRect(
    fieldX,
    fieldY,
    fieldW,
    fieldH
  );

  /* Außenlinie */
  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;

  ctx.strokeRect(
    fieldX,
    fieldY,
    fieldW,
    fieldH
  );

  /* Mittellinie */
  ctx.beginPath();

  ctx.moveTo(
    W / 2,
    fieldY
  );

  ctx.lineTo(
    W / 2,
    fieldY + fieldH
  );

  ctx.stroke();

  /* Mittelkreis */
  ctx.beginPath();

  ctx.arc(
    W / 2,
    H / 2,
    Math.min(fieldH * 0.16, 70),
    0,
    Math.PI * 2
  );

  ctx.stroke();

  /* Tore */

  const goalH = fieldH * 0.30;

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 7;

  /* links */

  ctx.strokeRect(
    fieldX - 35,
    H / 2 - goalH / 2,
    35,
    goalH
  );

  /* rechts */

  ctx.strokeRect(
    fieldX + fieldW,
    H / 2 - goalH / 2,
    35,
    goalH
  );

  /* Spieler */

  const players = [
    [fieldX + 80, H / 2, "#ffd83d", "TW"],
    [fieldX + fieldW * .25, fieldY + fieldH * .25, "#168cff", "LB"],
    [fieldX + fieldW * .30, H / 2, "#168cff", "CB"],
    [fieldX + fieldW * .25, fieldY + fieldH * .75, "#168cff", "RB"],
    [fieldX + fieldW * .43, fieldY + fieldH * .27, "#168cff", "LW"],
    [fieldX + fieldW * .47, H / 2, "#168cff", "MAX"],
    [fieldX + fieldW * .43, fieldY + fieldH * .73, "#168cff", "RW"],

    [fieldX + fieldW - 80, H / 2, "#ff5555", "TW"],
    [fieldX + fieldW * .75, fieldY + fieldH * .25, "#ff4444", "LB"],
    [fieldX + fieldW * .70, H / 2, "#ff4444", "CB"],
    [fieldX + fieldW * .75, fieldY + fieldH * .75, "#ff4444", "RB"],
    [fieldX + fieldW * .57, fieldY + fieldH * .27, "#ff4444", "LW"],
    [fieldX + fieldW * .53, H / 2, "#ff4444", "CF"],
    [fieldX + fieldW * .57, fieldY + fieldH * .73, "#ff4444", "RW"]
  ];

  for (const p of players) {

    ctx.beginPath();

    ctx.fillStyle = p[2];

    ctx.arc(
      p[0],
      p[1],
      20,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      p[3],
      p[0],
      p[1] + 4
    );
  }

  /* Ball */

  ctx.beginPath();

  ctx.fillStyle = "white";

  ctx.arc(
    W / 2,
    H / 2 - 35,
    9,
    0,
    Math.PI * 2
  );

  ctx.fill();

  requestAnimationFrame(draw);
}

draw();

/* Nach erfolgreichem Laden */

setTimeout(() => {
  document.getElementById("status").innerHTML =
    "WATERBALL 27<br><small>FUNKTIONIERT ✅</small>";
}, 500);

</script>

</body>
</html>
