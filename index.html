<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>WATERBALL 27</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06131e;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

/* =========================
   START
========================= */

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background:
      radial-gradient(circle at 50% 25%,#0877a8 0%,transparent 40%),
      linear-gradient(180deg,#061522,#020a10);
}

#start h1{
    margin:0;
    font-size:clamp(48px,12vw,100px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-4px;
}

#start .subtitle{
    margin-top:12px;
    font-size:13px;
    letter-spacing:4px;
    opacity:.7;
}

#start button{
    margin-top:42px;
    padding:18px 42px;
    border:0;
    border-radius:17px;
    background:#168cff;
    color:#fff;
    font-size:18px;
    font-weight:900;
    box-shadow:0 12px 35px rgba(22,140,255,.35);
}

#start button:active{
    transform:scale(.94);
}

#start .hint{
    margin-top:18px;
    max-width:330px;
    font-size:11px;
    opacity:.5;
    line-height:1.5;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    z-index:20;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:min(700px,94vw);
    height:66px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:6px 15px;

    color:#fff;
    background:rgba(3,10,17,.82);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;

    backdrop-filter:blur(12px);
    pointer-events:none;
}

.team{
    width:32%;
    text-align:center;
}

.teamName{
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    opacity:.7;
}

.score{
    font-size:27px;
    font-weight:1000;
}

#timer{
    width:30%;
    text-align:center;
    font-size:18px;
    font-weight:900;
}

#attackBox{
    position:fixed;
    z-index:21;
    top:84px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.55);
    border-radius:10px;
    padding:5px 12px;
    font-size:11px;
    font-weight:900;
    pointer-events:none;
}

#playerInfo{
    position:fixed;
    z-index:21;
    top:84px;
    left:14px;
    color:white;
    background:rgba(0,0,0,.55);
    padding:6px 10px;
    border-radius:10px;
    font-size:10px;
    font-weight:bold;
    pointer-events:none;
}

/* =========================
   STAMINA / SPRINT
========================= */

#status{
    position:fixed;
    z-index:25;
    top:84px;
    right:14px;
    width:145px;
    pointer-events:none;
}

.bar{
    height:20px;
    background:rgba(0,0,0,.55);
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    position:relative;
}

#stamina{
    width:100%;
    height:100%;
    background:#35d76c;
}

#staminaText{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:9px;
    font-weight:900;
}

#cooldown{
    margin-top:5px;
    height:7px;
    border-radius:8px;
    background:rgba(0,0,0,.5);
    overflow:hidden;
}

#cooldownFill{
    height:100%;
    width:0%;
    background:#36a8ff;
}

#cooldownText{
    margin-top:3px;
    text-align:center;
    color:white;
    font-size:8px;
    font-weight:bold;
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
}

/* JOYSTICK */

#joystick{
    position:absolute;
    left:24px;
    bottom:23px;

    width:150px;
    height:150px;

    border-radius:50%;
    background:rgba(255,255,255,.09);
    border:2px solid rgba(255,255,255,.18);

    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;

    width:66px;
    height:66px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(255,255,255,.3);
    border:2px solid rgba(255,255,255,.4);

    pointer-events:none;
}

/* BUTTONS */

#buttons{
    position:absolute;
    right:22px;
    bottom:22px;

    width:205px;
    height:205px;

    pointer-events:none;
}

.btn{
    position:absolute;

    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    font-size:11px;
    font-weight:1000;

    border:2px solid rgba(255,255,255,.28);

    box-shadow:
      0 8px 22px rgba(0,0,0,.25);

    pointer-events:auto;
    touch-action:none;
}

.btn:active{
    transform:scale(.91);
}

#pass{
    left:2px;
    top:65px;
    background:rgba(20,130,255,.8);
}

#shoot{
    right:0;
    top:5px;
    background:rgba(235,65,65,.85);
}

#sprint{
    right:0;
    bottom:0;
    background:rgba(40,190,100,.85);
}

#switch{
    left:10px;
    bottom:0;
    background:rgba(145,80,220,.82);
}

/* =========================
   MESSAGE
========================= */

#message{
    position:fixed;
    z-index:90;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);

    padding:17px 27px;

    background:rgba(0,0,0,.82);
    color:white;

    border-radius:17px;

    font-size:24px;
    font-weight:1000;

    opacity:0;
    pointer-events:none;

    transition:.18s;
}

#message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     START SCREEN
========================= -->

<div id="start">

    <h1>WATERBALL<br>27</h1>

    <div class="subtitle">
        SV LOK GÖRLITZ EDITION
    </div>

    <button id="startButton">
        SPIEL STARTEN
    </button>

    <div class="hint">
        Für iPhone im Querformat spielen.<br>
        Joystick · Pass · Wurf · Sprint · Spielerwechsel
    </div>

</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="team">
        <div class="teamName">
            SV LOK GÖRLITZ
        </div>
        <div class="score" id="homeScore">
            0
        </div>
    </div>

    <div id="timer">
        04:00
    </div>

    <div class="team">
        <div class="teamName">
            GUESTS
        </div>
        <div class="score" id="awayScore">
            0
        </div>
    </div>

</div>

<div id="attackBox">
    ANGRIFF <span id="attackTime">25</span>
</div>

<div id="playerInfo">
    CF · MAX HEINZE
</div>

<div id="status">

    <div class="bar">
        <div id="stamina"></div>
        <div id="staminaText">
            AUSDAUER 100
        </div>
    </div>

    <div id="cooldown">
        <div id="cooldownFill"></div>
    </div>

    <div id="cooldownText">
        SPRINT BEREIT
    </div>

</div>

<!-- =========================
     CONTROLS
========================= -->

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">

        <div class="btn" id="pass">
            PASS
        </div>

        <div class="btn" id="shoot">
            WURF
        </div>

        <div class="btn" id="sprint">
            SPRINT
        </div>

        <div class="btn" id="switch">
            WECHSEL
        </div>

    </div>

</div>

<div id="message"></div>

<script>

/* ============================================================
   WATERBALL 27
   Gameplay Engine
============================================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

addEventListener("resize",resize);

resize();


/* ============================================================
   FIELD
============================================================ */

const FIELD_W = 30;
const FIELD_H = 20;

const GOAL_WIDTH = 3;

function S(){

    return Math.min(
        (W-30)/FIELD_W,
        (H-120)/FIELD_H
    );

}

function sx(x){

    return W/2 +
        (x-FIELD_W/2)*S();

}

function sy(y){

    return 72+y*S();

}


/* ============================================================
   PLAYER FACTORY
============================================================ */

function createPlayer(
    id,
    team,
    pos,
    x,
    y,
    color,
    label
){

    return {

        id,
        team,
        pos,

        x,
        y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        color,
        label,

        stamina:100,

        hasBall:false,

        radius:.47,

        reaction:0,

        runPhase:Math.random()*10,

        mark:null,

        roleSpeed:2.1,

        sprinting:false

    };

}


/* ============================================================
   LOK TEAM
============================================================ */

/*
   U14/U16 are represented through age-group labels rather
   than creating detailed profiles of individual minors.
*/

const home = [

    createPlayer(
        1,
        "home",
        "TW",
        1.2,
        10,
        "#e4c342",
        "LOK U16 #1"
    ),

    createPlayer(
        2,
        "home",
        "LB",
        5.7,
        5.2,
        "#f0c93d",
        "LOK U14 #2"
    ),

    createPlayer(
        3,
        "home",
        "CB",
        5.2,
        10,
        "#f0c93d",
        "LOK U16 #3"
    ),

    createPlayer(
        4,
        "home",
        "RB",
        5.7,
        14.8,
        "#f0c93d",
        "LOK U16 #4"
    ),

    createPlayer(
        5,
        "home",
        "LW",
        10.5,
        5.5,
        "#f0c93d",
        "LOK U14 #5"
    ),

    createPlayer(
        6,
        "home",
        "CF",
        12.8,
        10,
        "#ffffff",
        "MAX HEINZE"
    ),

    createPlayer(
        7,
        "home",
        "RW",
        10.5,
        14.5,
        "#f0c93d",
        "LOK U14 #7"
    )

];


/* ============================================================
   OPPONENT TEAM
============================================================ */

const away = [

    createPlayer(
        101,
        "away",
        "TW",
        28.8,
        10,
        "#e65061",
        "GUEST GK"
    ),

    createPlayer(
        102,
        "away",
        "LB",
        24.2,
        5.2,
        "#ed5262",
        "GUEST LB"
    ),

    createPlayer(
        103,
        "away",
        "CB",
        24.8,
        10,
        "#ed5262",
        "GUEST CB"
    ),

    createPlayer(
        104,
        "away",
        "RB",
        24.2,
        14.8,
        "#ed5262",
        "GUEST RB"
    ),

    createPlayer(
        105,
        "away",
        "LW",
        19.5,
        5.5,
        "#ed5262",
        "GUEST LW"
    ),

    createPlayer(
        106,
        "away",
        "CF",
        17.2,
        10,
        "#ed5262",
        "GUEST CF"
    ),

    createPlayer(
        107,
        "away",
        "RW",
        19.5,
        14.5,
        "#ed5262",
        "GUEST RW"
    )

];

const players =
    [...home,...away];

let active = home[5];


/* ============================================================
   BALL
============================================================ */

const ball = {

    x:15,
    y:10,

    vx:0,
    vy:0,

    owner:null,

    target:null,

    radius:.23

};


/* ============================================================
   GAME STATE
============================================================ */

let playing=false;

let homeScore=0;
let awayScore=0;

let matchTime=240;

let attackTime=25;

let attackTeam="home";

let goalLock=0;

let restartTimer=0;


/* ============================================================
   JOYSTICK
============================================================ */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyPointer=null;

let joyX=0;
let joyY=0;

function joystickMove(e){

    const r =
        joystick.getBoundingClientRect();

    let x =
        e.clientX -
        (r.left+r.width/2);

    let y =
        e.clientY -
        (r.top+r.height/2);

    const max =
        r.width/2-32;

    const len =
        Math.hypot(x,y);

    if(len>max){

        x=x/len*max;
        y=y/len*max;

    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform =
        `translate(calc(-50% + ${x}px),
                   calc(-50% + ${y}px))`;
}

function joystickReset(){

    joyPointer=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(-50%,-50%)";

}

joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId!==joyPointer)
            return;

        e.preventDefault();

        joystickMove(e);

    }
);

joystick.addEventListener(
    "pointerup",
    e=>{

        if(e.pointerId===joyPointer)
            joystickReset();

    }
);

joystick.addEventListener(
    "pointercancel",
    joystickReset
);


/* ============================================================
   SPRINT SYSTEM
============================================================ */

let sprintHeld=false;

let sprintEnergy=100;

let sprintCooldown=0;

const SPRINT_MAX=100;

const SPRINT_DRAIN=28;

const SPRINT_RECOVER=18;

const SPRINT_COOLDOWN=1.7;

const SPRINT_SPEED=6.6;

const NORMAL_SPEED=3.9;

function canSprint(){

    return (
        sprintCooldown<=0 &&
        sprintEnergy>10
    );

}

function startSprint(){

    if(canSprint())
        sprintHeld=true;

}

function stopSprint(){

    if(sprintHeld){

        sprintHeld=false;

        /*
           Short FC-style boost cooldown after release.
        */

        sprintCooldown=SPRINT_COOLDOWN;

    }

}


/* ============================================================
   SPRINT BUTTON
============================================================ */

const sprintButton=
    document.getElementById("sprint");

sprintButton.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        startSprint();

    }
);

sprintButton.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        stopSprint();

    }
);

sprintButton.addEventListener(
    "pointercancel",
    stopSprint
);


/* ============================================================
   PASS ENGINE
============================================================ */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}

function angleDifference(
    ax,ay,
    bx,by
){

    const a=Math.atan2(ay,ax);
    const b=Math.atan2(by,bx);

    let d=Math.abs(a-b);

    if(d>Math.PI)
        d=Math.PI*2-d;

    return d;

}

function findBestPass(){

    const teammates =
        home.filter(
            p=>p!==active
        );

    let best=null;
    let bestScore=-Infinity;

    /*
       Direction of user's current movement.
    */

    let dx=joyX;
    let dy=joyY;

    if(Math.hypot(dx,dy)<.15){

        dx=1;
        dy=0;

    }

    for(const p of teammates){

        const px=p.x-active.x;
        const py=p.y-active.y;

        const d=Math.hypot(px,py);

        if(d<1 || d>13)
            continue;

        const dirScore =
            1-angleDifference(
                dx,dy,
                px,py
            )/Math.PI;

        const nearestEnemy =
            Math.min(
                ...away.map(
                    o=>distance(o,p)
                )
            );

        const freeSpace =
            Math.min(
                nearestEnemy/5,
                1
            );

        /*
           Forward players receive bonus.
        */

        const forward =
            px/FIELD_W;

        const score =
            dirScore*4 +
            freeSpace*3 +
            forward*2 -
            d*.18;

        if(score>bestScore){

            bestScore=score;
            best=p;

        }

    }

    return best;

}


/* ============================================================
   PASS BUTTON
============================================================ */

document
.getElementById("pass")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        pass();

    }
);

function pass(){

    if(!playing)
        return;

    if(ball.owner!==active){

        /*
           Control loose ball if close enough.
        */

        if(distance(active,ball)<1.2){

            giveBall(active);

        }

        return;

    }

    const target=findBestPass();

    if(!target)
        return;

    active.hasBall=false;

    ball.owner=null;

    ball.target=target;

    ball.x=active.x;
    ball.y=active.y;

    const dx=target.x-active.x;
    const dy=target.y-active.y;

    const d=Math.hypot(dx,dy)||1;

    const speed=12.5;

    ball.vx=
        dx/d*speed;

    ball.vy=
        dy/d*speed;

}


/* ============================================================
   SHOOT ENGINE
============================================================ */

let shooting=false;
let shotPower=0;

const shootButton=
    document.getElementById("shoot");

shootButton.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        shooting=true;
        shotPower=0;

    }
);

function releaseShoot(){

    if(!shooting)
        return;

    shooting=false;

    shoot(shotPower);

    shotPower=0;

}

shootButton.addEventListener(
    "pointerup",
    releaseShoot
);

shootButton.addEventListener(
    "pointercancel",
    releaseShoot
);

function shoot(power){

    if(!playing)
        return;

    if(ball.owner!==active)
        return;

    /*
       Goal is to the right.
    */

    let targetX=FIELD_W+1;
    let targetY=FIELD_H/2;

    /*
       Aim with joystick.
    */

    if(
        Math.abs(joyX)+
        Math.abs(joyY)>.2
    ){

        targetX=
            active.x+
            Math.max(
                3,
                joyX*15
            );

        targetY=
            active.y+
            joyY*8;

    }

    /*
       Clamp target around goal.
    */

    targetX=FIELD_W+1;

    targetY=Math.max(
        FIELD_H/2-GOAL_WIDTH*.47,
        Math.min(
            FIELD_H/2+GOAL_WIDTH*.47,
            targetY
        )
    );

    const dx=targetX-active.x;
    const dy=targetY-active.y;

    const d=Math.hypot(dx,dy)||1;

    const speed=
        10+
        Math.min(power,1)*13;

    active.hasBall=false;
    ball.owner=null;
    ball.target=null;

    ball.x=active.x;
    ball.y=active.y;

    ball.vx=dx/d*speed;
    ball.vy=dy/d*speed;

}


/* ============================================================
   BALL OWNERSHIP
============================================================ */

function giveBall(p){

    if(ball.owner)
        ball.owner.hasBall=false;

    ball.owner=p;
    p.hasBall=true;

    ball.target=null;

    ball.vx=0;
    ball.vy=0;

    /*
       New possession = new attack clock.
    */

    if(p.team!==attackTeam){

        attackTeam=p.team;

        attackTime=25;

    }

}


/* ============================================================
   PLAYER SWITCH
============================================================ */

document
.getElementById("switch")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        switchPlayer();

    }
);

function switchPlayer(){

    const candidates=
        home.filter(
            p=>p!==active &&
               p.pos!=="TW"
        );

    let best=null;
    let score=-Infinity;

    for(const p of candidates){

        const d=
            distance(p,ball);

        const goalSide=
            p.x/ FIELD_W;

        let s=
            -d*2+
            goalSide*2;

        /*
           Defending: favour closest player.
        */

        if(
            ball.owner &&
            ball.owner.team==="away"
        ){

            s=
                -d*3+
                (p.x<ball.x ? 2:0);

        }

        if(s>score){

            score=s;
            best=p;

        }

    }

    if(best){

        active=best;

        updatePlayerHUD();

    }

}

function updatePlayerHUD(){

    document
    .getElementById("playerInfo")
    .textContent=
        `${active.pos} · ${active.label}`;

}


/* ============================================================
   ACTIVE PLAYER MOVEMENT
============================================================ */

function moveActive(dt){

    let x=joyX;
    let y=joyY;

    const magnitude=
        Math.hypot(x,y);

    if(magnitude<.06){

        active.vx*=.8;
        active.vy*=.8;

        if(!sprintHeld){

            sprintEnergy+=
                SPRINT_RECOVER*dt;

        }

        return;

    }

    if(magnitude>1){

        x/=magnitude;
        y/=magnitude;

    }

    let speed=NORMAL_SPEED;

    /*
       SPRINT
    */

    if(
        sprintHeld &&
        canSprint()
    ){

        speed=SPRINT_SPEED;

        sprintEnergy-=
            SPRINT_DRAIN*dt;

        active.sprinting=true;

        if(sprintEnergy<=0){

            sprintEnergy=0;

            stopSprint();

        }

    }else{

        active.sprinting=false;

        sprintEnergy+=
            SPRINT_RECOVER*dt;

    }

    sprintEnergy=
        Math.max(
            0,
            Math.min(
                SPRINT_MAX,
                sprintEnergy
            )
        );

    active.vx=x*speed;
    active.vy=y*speed;

    active.x+=active.vx*dt;
    active.y+=active.vy*dt;

    active.x=
        Math.max(
            .7,
            Math.min(
                FIELD_W-.7,
                active.x
            )
        );

    active.y=
        Math.max(
            .7,
            Math.min(
                FIELD_H-.7,
                active.y
            )
        );

}


/* ============================================================
   TEAM TACTICAL POSITIONS
============================================================ */

const roleOffsets={

    TW:{x:-1,y:0},

    LB:{x:0,y:-1.2},

    CB:{x:0,y:0},

    RB:{x:0,y:1.2},

    LW:{x:2,y:-2.4},

    CF:{x:3,y:0},

    RW:{x:2,y:2.4}

};


/* ============================================================
   HOME AI
============================================================ */

function updateHomeAI(p,dt){

    if(p===active)
        return;

    let tx=p.homeX;
    let ty=p.homeY;

    const owner=
        ball.owner;

    /*
       Attack with ball.
    */

    if(
        owner &&
        owner.team==="home"
    ){

        /*
           Move attackers into spaces.
        */

        if(
            p.pos==="LW" ||
            p.pos==="RW"
        ){

            tx+=2.2;
        }

        if(p.pos==="CF"){

            tx+=1.8;

        }

        /*
           If active player has ball,
           teammates make curved-looking
           support runs.
        */

        if(owner===active){

            const side=
                p.pos==="LW" ? -1 :
                p.pos==="RW" ? 1 :
                0;

            ty=
                p.homeY+
                Math.sin(
                    performance.now()/700+
                    p.id
                )*
                .9+
                side*.3;

        }

    }

    /*
       Defending.
    */

    if(
        owner &&
        owner.team==="away"
    ){

        const d=
            distance(p,ball);

        /*
           Closest player presses.
        */

        if(
            d<5 &&
            p.pos!=="TW"
        ){

            tx=
                ball.x;

            ty=
                ball.y;

        }else{

            /*
               Defensive line shifts
               toward ball.
            */

            tx=
                p.homeX+
                (ball.x-15)*.13;

            ty=
                p.homeY+
                (ball.y-10)*.12;

        }

    }

    /*
       Avoid bunching.
    */

    for(const other of home){

        if(other===p)
            continue;

        const d=
            distance(p,other);

        if(d<1.2){

            tx+=
                (p.x-other.x)*.8;

            ty+=
                (p.y-other.y)*.8;

        }

    }

    aiMove(
        p,
        tx,
        ty,
        2.25,
        dt
    );

}


/* ============================================================
   AWAY AI
============================================================ */

function updateAwayAI(p,dt){

    let tx=p.homeX;
    let ty=p.homeY;

    const owner=
        ball.owner;

    /*
       Away has ball.
    */

    if(
        owner &&
        owner.team==="away"
    ){

        if(p.pos==="LW" ||
           p.pos==="RW"){

            tx-=1.7;

        }

        if(p.pos==="CF"){

            tx-=2;

        }

        /*
           Make space around ball carrier.
        */

        if(owner!==p){

            const side=
                p.pos==="LW" ? -1 :
                p.pos==="RW" ? 1 :
                0;

            ty=
                p.homeY+
                Math.sin(
                    performance.now()/650+
                    p.id
                )*
                .8+
                side*.4;

        }

    }

    /*
       Pressing Lok.
    */

    if(
        owner &&
        owner.team==="home"
    ){

        const d=
            distance(p,ball);

        if(
            d<6 &&
            p.pos!=="TW"
        ){

            /*
               Not everyone chases.
               Only nearby players press.
            */

            if(
                p.pos==="CB" ||
                d<3.2
            ){

                tx=ball.x;
                ty=ball.y;

            }else{

                /*
                   Cut passing lanes.
                */

                tx=
                    p.homeX+
                    (ball.x-15)*.12;

                ty=
                    p.homeY+
                    (ball.y-10)*.15;

            }

        }

    }

    /*
       Keeper.
    */

    if(p.pos==="TW"){

        tx=
            FIELD_W-.9;

        ty=
            Math.max(
                FIELD_H/2-4,
                Math.min(
                    FIELD_H/2+4,
                    ball.y
                )
            );

    }

    aiMove(
        p,
        tx,
        ty,
        2.2,
        dt
    );

}


/* ============================================================
   AI MOVEMENT
============================================================ */

function aiMove(
    p,
    tx,
    ty,
    speed,
    dt
){

    const dx=
        tx-p.x;

    const dy=
        ty-p.y;

    const d=
        Math.hypot(dx,dy);

    if(d<.15){

        p.vx*=.7;
        p.vy*=.7;

        return;

    }

    p.vx=
        dx/d*speed;

    p.vy=
        dy/d*speed;

    p.x+=
        p.vx*dt;

    p.y+=
        p.vy*dt;

    p.x=
        Math.max(
            .6,
            Math.min(
                FIELD_W-.6,
                p.x
            )
        );

    p.y=
        Math.max(
            .6,
            Math.min(
                FIELD_H-.6,
                p.y
            )
        );

}


/* ============================================================
   BALL PHYSICS
============================================================ */

function updateBall(dt){

    if(ball.owner){

        const p=
            ball.owner;

        let dx=p.vx;
        let dy=p.vy;

        const d=
            Math.hypot(dx,dy);

        if(d<.1){

            dx=
                p.team==="home"
                ? 1
                : -1;

            dy=0;

        }else{

            dx/=d;
            dy/=d;

        }

        ball.x=
            p.x+
            dx*.55;

        ball.y=
            p.y+
            dy*.55;

        return;

    }

    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;

    /*
       Water drag.
    */

    ball.vx*=
        Math.pow(.10,dt);

    ball.vy*=
        Math.pow(.10,dt);

    /*
       Side walls.
    */

    if(ball.y<.2){

        ball.y=.2;
        ball.vy=
            Math.abs(ball.vy)*.5;

    }

    if(ball.y>FIELD_H-.2){

        ball.y=FIELD_H-.2;
        ball.vy=
            -Math.abs(ball.vy)*.5;

    }

    /*
       Side walls except goal opening.
    */

    const goalOpening=
        Math.abs(
            ball.y-FIELD_H/2
        )<
        GOAL_WIDTH/2;

    if(
        ball.x<.1 &&
        !goalOpening
    ){

        ball.x=.1;
        ball.vx=
            Math.abs(ball.vx)*.5;

    }

    if(
        ball.x>FIELD_W-.1 &&
        !goalOpening
    ){

        ball.x=
            FIELD_W-.1;

        ball.vx=
            -Math.abs(ball.vx)*.5;

    }

    /*
       Pass reception.
    */

    if(ball.target){

        if(
            distance(
                ball,
                ball.target
            )<.65
        ){

            giveBall(
                ball.target
            );

            ball.target=null;

            return;

        }

    }

    /*
       Interceptions.
    */

    for(const p of players){

        if(
            distance(p,ball)<.58
        ){

            /*
               Keeper and field players
               can control loose passes.
            */

            giveBall(p);

            return;

        }

    }

}


/* ============================================================
   GOAL DETECTION
============================================================ */

function checkGoal(){

    if(goalLock>0)
        return;

    /*
       HOME GOAL
       Ball enters right side.
    */

    if(
        ball.x>
        FIELD_W+.15 &&
        Math.abs(
            ball.y-FIELD_H/2
        )<
        GOAL_WIDTH/2
    ){

        goal("home");

        return;

    }

    /*
       AWAY GOAL
       Ball enters left side.
    */

    if(
        ball.x<-.15 &&
        Math.abs(
            ball.y-FIELD_H/2
        )<
        GOAL_WIDTH/2
    ){

        goal("away");

    }

}


/* ============================================================
   GOAL
============================================================ */

function goal(team){

    goalLock=2;

    if(team==="home"){

        homeScore++;

        document
        .getElementById("homeScore")
        .textContent=
            homeScore;

        message(
            "TOR FÜR LOK! 🟡"
        );

    }else{

        awayScore++;

        document
        .getElementById("awayScore")
        .textContent=
            awayScore;

        message(
            "TOR GUESTS"
        );

    }

    restartTimer=.8;

}


/* ============================================================
   RESET AFTER GOAL
============================================================ */

function resetAfterGoal(){

    ball.owner=null;
    ball.target=null;

    ball.vx=0;
    ball.vy=0;

    ball.x=15;
    ball.y=10;

    attackTeam=
        restartTimer<=0
        ? "home"
        : "home";

    attackTime=25;

    for(const p of players){

        p.hasBall=false;

        p.vx=0;
        p.vy=0;

        p.x=p.homeX;
        p.y=p.homeY;

    }

    active=home[5];

    updatePlayerHUD();

    setTimeout(()=>{

        if(playing){

            giveBall(
                active
            );

        }

    },800);

}


/* ============================================================
   GOALKEEPER AI
============================================================ */

function goalkeeperSave(){

    /*
       Home keeper.
    */

    const keepers=[
        home[0],
        away[0]
    ];

    for(const g of keepers){

        if(
            !ball.owner &&
            Math.abs(
                ball.x-g.x
            )<4
        ){

            /*
               Move keeper toward
               incoming ball trajectory.
            */

            const targetY=
                ball.y;

            g.y+=
                (targetY-g.y)*
                .08;

            g.y=
                Math.max(
                    FIELD_H/2-3,
                    Math.min(
                        FIELD_H/2+3,
                        g.y
                    )
                );

            /*
               Save incoming shot.
            */

            if(
                distance(g,ball)<1
            ){

                ball.vx*=-.5;
                ball.vy*=.4;

                ball.x=
                    g.team==="home"
                    ? 1.6
                    : FIELD_W-1.6;

            }

        }

    }

}


/* ============================================================
   ATTACK CLOCK
============================================================ */

let attackAccumulator=0;

function updateAttackClock(dt){

    if(!ball.owner)
        return;

    if(
        ball.owner.team===
        attackTeam
    ){

        attackAccumulator+=dt;

        if(attackAccumulator>=1){

            attackAccumulator-=1;

            attackTime--;

            if(attackTime<=0){

                /*
                   Turnover.
                */

                ball.owner.hasBall=false;

                ball.owner=null;

                attackTeam=
                    attackTeam==="home"
                    ?"away"
                    :"home";

                attackTime=25;

                ball.x=15;
                ball.y=10;

                ball.vx=0;
                ball.vy=0;

                message(
                    "ANGRIFFSZEIT ABGELAUFEN"
                );

            }

        }

    }

}


/* ============================================================
   TIMER
============================================================ */

let timeAccumulator=0;

function updateTimer(dt){

    timeAccumulator+=dt;

    if(
        timeAccumulator>=1
    ){

        timeAccumulator-=1;

        if(matchTime>0){

            matchTime--;

        }else{

            playing=false;

            message(
                "SPIEL ENDE"
            );

        }

    }

    const m=
        Math.floor(
            matchTime/60
        );

    const s=
        matchTime%60;

    document
    .getElementById("timer")
    .textContent=
        `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}


/* ============================================================
   SHOOT CHARGE
============================================================ */

function updateShot(dt){

    if(shooting){

        shotPower+=
            dt*.8;

        shotPower=
            Math.min(
                1,
                shotPower
            );

    }

}


/* ============================================================
   SPRINT UPDATE
============================================================ */

function updateSprint(dt){

    if(sprintCooldown>0){

        sprintCooldown-=dt;

        if(sprintCooldown<0)
            sprintCooldown=0;

    }

    if(!sprintHeld){

        sprintEnergy+=
            SPRINT_RECOVER*dt;

    }

    sprintEnergy=
        Math.max(
            0,
            Math.min(
                100,
                sprintEnergy
            )
        );

    /*
       Automatically stop sprint if
       cooldown/energy forces it.
    */

    if(
        sprintHeld &&
        !canSprint()
    ){

        stopSprint();

    }

}


/* ============================================================
   UI UPDATE
============================================================ */

function updateUI(){

    document
    .getElementById("stamina")
    .style.width=
        sprintEnergy+"%";

    document
    .getElementById("staminaText")
    .textContent=
        "AUSDAUER "+
        Math.round(sprintEnergy);

    const cd=
        sprintCooldown<=0
        ?0
        :
        (sprintCooldown/
         SPRINT_COOLDOWN)*100;

    document
    .getElementById("cooldownFill")
    .style.width=
        cd+"%";

    document
    .getElementById("cooldownText")
    .textContent=
        sprintCooldown<=0
        ?"SPRINT BEREIT"
        :
        "SPRINT COOLDOWN "+
        sprintCooldown.toFixed(1)+"s";

    document
    .getElementById("attackTime")
    .textContent=
        Math.max(
            0,
            attackTime
        );

}


/* ============================================================
   MESSAGE
============================================================ */

let messageTimeout=null;

function message(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(
        messageTimeout
    );

    messageTimeout=
        setTimeout(()=>{

            el.classList.remove(
                "show"
            );

        },1100);

}


/* ============================================================
   DRAW BACKGROUND
============================================================ */

function drawBackground(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#075b84"
    );

    gradient.addColorStop(
        .5,
        "#087fa5"
    );

    gradient.addColorStop(
        1,
        "#034e6c"
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       Water lines.
    */

    ctx.globalAlpha=.13;

    ctx.strokeStyle="#fff";

    ctx.lineWidth=1;

    for(
        let y=80;
        y<H;
        y+=24
    ){

        ctx.beginPath();

        for(
            let x=0;
            x<W;
            x+=35
        ){

            ctx.moveTo(
                x,
                y
            );

            ctx.quadraticCurveTo(
                x+10,
                y-2,
                x+18,
                y
            );

            ctx.quadraticCurveTo(
                x+26,
                y+2,
                x+35,
                y
            );

        }

        ctx.stroke();

    }

    ctx.globalAlpha=1;

}


/* ============================================================
   DRAW FIELD
============================================================ */

function drawField(){

    const s=S();

    const left=sx(0);
    const top=sy(0);

    const width=
        FIELD_W*s;

    const height=
        FIELD_H*s;

    /*
       Pool.
    */

    ctx.fillStyle=
        "#087da3";

    ctx.fillRect(
        left,
        top,
        width,
        height
    );

    /*
       Border.
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.7)";

    ctx.lineWidth=3;

    ctx.strokeRect(
        left,
        top,
        width,
        height
    );

    /*
       Half line.
    */

    ctx.beginPath();

    ctx.moveTo(
        sx(15),
        sy(0)
    );

    ctx.lineTo(
        sx(15),
        sy(20)
    );

    ctx.stroke();

    /*
       Center circle.
    */

    ctx.beginPath();

    ctx.arc(
        sx(15),
        sy(10),
        2*s,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       2m lines.
    */

    for(
        const x of [2,28]
    ){

        ctx.beginPath();

        ctx.moveTo(
            sx(x),
            sy(0)
        );

        ctx.lineTo(
            sx(x),
            sy(20)
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.35)";

        ctx.stroke();

    }

    /*
       5m lines.
    */

    for(
        const x of [5,25]
    ){

        ctx.beginPath();

        ctx.moveTo(
            sx(x),
            sy(0)
        );

        ctx.lineTo(
            sx(x),
            sy(20)
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.42)";

        ctx.stroke();

    }

    /*
       Goals.
    */

    drawGoal(0);
    drawGoal(FIELD_W);

}


/* ============================================================
   DRAW GOAL
============================================================ */

function drawGoal(x){

    const s=S();

    const y=
        sy(
            FIELD_H/2-
            GOAL_WIDTH/2
        );

    const h=
        GOAL_WIDTH*s;

    const depth=
        1.15*s;

    const gx=sx(x);

    const left=
        x===0
        ?gx-depth
        :gx;

    ctx.fillStyle=
        "rgba(255,255,255,.13)";

    ctx.fillRect(
        left,
        y,
        depth,
        h
    );

    ctx.strokeStyle=
        "#fff";

    ctx.lineWidth=3;

    ctx.strokeRect(
        left,
        y,
        depth,
        h
    );

    /*
       net.
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=1;

    for(
        let i=1;
        i<6;
        i++
    ){

        ctx.beginPath();

        const yy=
            y+
            h*i/6;

        ctx.moveTo(
            left,
            yy
        );

        ctx.lineTo(
            left+depth,
            yy
        );

        ctx.stroke();

    }

}


/* ============================================================
   DRAW PLAYER
============================================================ */

function drawPlayer(p){

    const s=S();

    const x=sx(p.x);
    const y=sy(p.y);

    const r=.47*s;

    /*
       water shadow
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+r*.4,
        r*1.25,
        r*.55,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,20,30,.22)";

    ctx.fill();

    /*
       active ring
    */

    if(p===active){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r*1.55,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=3;

        ctx.stroke();

    }

    /*
       Body.
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        p.color;

    ctx.fill();

    /*
       Head.
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y-r*.58,
        r*.42,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#e4b487";

    ctx.fill();

    /*
       Cap.
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y-r*.64,
        r*.43,
        Math.PI,
        0
    );

    ctx.fillStyle=
        p.team==="home"
        ?"#e3bd36"
        :"#dc4254";

    ctx.fill();

    /*
       Ball indicator.
    */

    if(p.hasBall){

        ctx.beginPath();

        ctx.arc(
            x+r*.85,
            y-r*.35,
            r*.25,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#fff";

        ctx.fill();

    }

    /*
       active arrow.
    */

    if(p===active){

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.moveTo(
            x,
            y-r*2
        );

        ctx.lineTo(
            x-5,
            y-r*1.45
        );

        ctx.lineTo(
            x+5,
            y-r*1.45
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* ============================================================
   DRAW BALL
============================================================ */

function drawBall(){

    const s=S();

    const x=sx(ball.x);
    const y=sy(ball.y);

    const r=
        Math.max(
            3,
            ball.radius*s
        );

    ctx.beginPath();

    ctx.arc(
        x+2,
        y+3,
        r*1.1,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,0,0,.2)";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#fff";

    ctx.fill();

    ctx.strokeStyle="#333";

    ctx.lineWidth=1;

    ctx.stroke();

}


/* ============================================================
   UPDATE
============================================================ */

function update(dt){

    if(!playing)
        return;

    if(goalLock>0){

        goalLock-=dt;

        if(goalLock<=0){

            resetAfterGoal();

        }

        return;

    }

    if(restartTimer>0){

        restartTimer-=dt;

        return;

    }

    moveActive(dt);

    /*
       AI.
    */

    for(
        const p of home
    ){

        updateHomeAI(
            p,
            dt
        );

    }

    for(
        const p of away
    ){

        updateAwayAI(
            p,
            dt
        );

    }

    updateBall(dt);

    goalkeeperSave();

    checkGoal();

    updateAttackClock(dt);

    updateTimer(dt);

    updateShot(dt);

    updateSprint(dt);

    updateUI();

}


/* ============================================================
   RENDER
============================================================ */

function render(){

    drawBackground();

    drawField();

    const sorted=
        [...players]
        .sort(
            (a,b)=>a.y-b.y
        );

    for(
        const p of sorted
    ){

        drawPlayer(p);

    }

    drawBall();

}


/* ============================================================
   GAME LOOP
============================================================ */

let last=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );

    last=now;

    update(dt);

    render();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* ============================================================
   START GAME
============================================================ */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

function startGame(){

    document
    .getElementById("start")
    .style.display="none";

    homeScore=0;
    awayScore=0;

    matchTime=240;

    attackTime=25;

    sprintEnergy=100;

    sprintCooldown=0;

    sprintHeld=false;

    shooting=false;

    shotPower=0;

    document
    .getElementById("homeScore")
    .textContent="0";

    document
    .getElementById("awayScore")
    .textContent="0";

    /*
       Reset positions.
    */

    for(
        const p of players
    ){

        p.x=p.homeX;
        p.y=p.homeY;

        p.vx=0;
        p.vy=0;

        p.hasBall=false;

        p.stamina=100;

    }

    active=home[5];

    updatePlayerHUD();

    ball.x=15;
    ball.y=10;

    ball.vx=0;
    ball.vy=0;

    ball.owner=null;
    ball.target=null;

    playing=true;

    setTimeout(
        ()=>{
            giveBall(active);
        },
        500
    );

}


/* ============================================================
   KEYBOARD TEST CONTROLS
============================================================ */

const keys={};

addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(e.key===" "){
            e.preventDefault();
        }

    }
);

addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);

setInterval(
    ()=>{

        if(!playing)
            return;

        if(
            keys["shift"] &&
            !sprintHeld
        ){

            startSprint();

        }

        if(
            !keys["shift"] &&
            sprintHeld
        ){

            stopSprint();

        }

        if(keys["e"]){

            keys["e"]=false;

            pass();

        }

        if(keys["q"]){

            keys["q"]=false;

            switchPlayer();

        }

    },
    30
);


/* ============================================================
   PREVENT IPHONE GESTURES
============================================================ */

document.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

document.addEventListener(
    "gesturestart",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

</script>
