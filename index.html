<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#041522">
<title>WATERBALL 27</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02080d;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* =========================
   LOADING
========================= */

#loading{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#0c4262 0%,#041522 45%,#02080d 100%);
  transition:opacity .5s;
}

#loading.hide{
  opacity:0;
  pointer-events:none;
}

.logo{
  font-size:42px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:4px;
  color:white;
  text-shadow:
    0 0 12px #19baff,
    0 0 35px #087cae;
}

.subtitle{
  margin-top:8px;
  font-size:11px;
  letter-spacing:3px;
  opacity:.65;
}

.loader{
  width:220px;
  height:5px;
  margin-top:28px;
  border-radius:20px;
  overflow:hidden;
  background:#17384c;
}

#loadbar{
  width:15%;
  height:100%;
  background:#23bdff;
  box-shadow:0 0 15px #23bdff;
  transition:width .25s;
}

#loadtext{
  margin-top:12px;
  font-size:11px;
  opacity:.55;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:20;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(650px,94vw);
  pointer-events:none;
}

.scoreboard{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:9px 17px;
  border-radius:18px;
  background:rgba(2,12,20,.78);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(12px);
}

.team{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.home{
  color:#53caff;
}

.away{
  color:#ff6472;
}

.score{
  min-width:65px;
  text-align:center;
  font-size:24px;
  font-weight:1000;
}

#matchTime{
  text-align:center;
  margin-top:4px;
  font-size:10px;
  opacity:.65;
}

#playerPanel{
  position:absolute;
  z-index:21;
  top:85px;
  left:12px;
  padding:10px 13px;
  min-width:150px;
  border-radius:14px;
  background:rgba(2,12,20,.75);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  pointer-events:none;
}

#playerName{
  font-size:14px;
  font-weight:1000;
}

#playerPosition{
  margin-top:2px;
  font-size:10px;
  opacity:.6;
}

.staminaOuter{
  width:125px;
  height:5px;
  margin-top:8px;
  border-radius:20px;
  background:#26343b;
  overflow:hidden;
}

#stamina{
  width:100%;
  height:100%;
  background:#39e879;
}

#message{
  position:absolute;
  z-index:50;
  left:50%;
  top:68%;
  transform:translate(-50%,-50%);
  padding:11px 20px;
  border-radius:13px;
  background:rgba(0,0,0,.75);
  font-weight:1000;
  font-size:14px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

#message.show{
  opacity:1;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.17);
  backdrop-filter:blur(7px);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  margin-left:-29px;
  margin-top:-29px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  border:2px solid rgba(255,255,255,.45);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.buttons{
  position:absolute;
  right:18px;
  bottom:22px;
  width:190px;
  height:185px;
  pointer-events:none;
}

.btn{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:white;
  font-size:10px;
  font-weight:1000;
  background:rgba(4,18,29,.82);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 7px 22px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  pointer-events:auto;
}

.btn:active{
  transform:scale(.9);
  background:#147eae;
}

#pass{
  width:62px;
  height:62px;
  left:0;
  bottom:8px;
}

#shoot{
  width:78px;
  height:78px;
  right:0;
  bottom:42px;
  background:rgba(9,108,162,.82);
}

#sprint{
  width:58px;
  height:58px;
  left:70px;
  top:0;
}

#switch{
  width:54px;
  height:54px;
  right:5px;
  top:0;
  transform:translateY(-60px);
}

#rotate{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:#02080d;
  color:white;
}

#rotateIcon{
  font-size:55px;
}

@media (orientation:portrait) and (max-width:700px){
  #rotate{
    display:flex;
  }
}

@media(max-height:500px){
  #joystick{
    width:115px;
    height:115px;
  }

  #stick{
    width:50px;
    height:50px;
    margin-left:-25px;
    margin-top:-25px;
  }

  .buttons{
    transform:scale(.85);
    transform-origin:bottom right;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <div class="logo">WATERBALL 27</div>
  <div class="subtitle">NEXT GENERATION WATER POLO</div>

  <div class="loader">
    <div id="loadbar"></div>
  </div>

  <div id="loadtext">SPIEL WIRD GELADEN...</div>
</div>

<div id="rotate">
  <div id="rotateIcon">📱↔️</div>
  <h2>Handy drehen</h2>
  <p>WATERBALL 27 läuft im Querformat.</p>
</div>

<div id="hud">
  <div class="scoreboard">
    <div class="team home">SV LOK GÖRLITZ</div>

    <div class="score">
      <span id="homeScore">0</span>
      :
      <span id="awayScore">0</span>
    </div>

    <div class="team away">SVV PLAUEN</div>
  </div>

  <div id="matchTime">
    1. Viertel · 00:00
  </div>
</div>

<div id="playerPanel">
  <div id="playerName">MAX HEINZE</div>
  <div id="playerPosition">CF · #6</div>

  <div class="staminaOuter">
    <div id="stamina"></div>
  </div>
</div>

<div id="message"></div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="buttons">

    <div class="btn" id="pass">
      PASS
    </div>

    <div class="btn" id="shoot">
      WURF
    </div>

    <div class="btn" id="sprint">
      SPRINT
    </div>

    <div class="btn" id="switch">
      WECHSEL
    </div>

  </div>

</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

import * as SkeletonUtils from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js';


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let baseModel=null;

const players=[];
const ballObjects=[];

let activePlayer=0;
let ballCarrier=0;

let homeScore=0;
let awayScore=0;

let gameTime=0;

let sprinting=false;

const joystick={
  active:false,
  x:0,
  y:0
};

const keys={};

const pool={
  width:25.6,
  length:20
};


/* =====================================================
   FORMATION
===================================================== */

const formation=[

  {pos:'CF',x:0,z:3.5},

  {pos:'LW',x:-8,z:1.8},

  {pos:'RW',x:8,z:1.8},

  {pos:'LB',x:-5.8,z:-1.5},

  {pos:'RB',x:5.8,z:-1.5},

  {pos:'CB',x:0,z:-.4},

  {pos:'GK',x:0,z:-7.5}

];


/* =====================================================
   START
===================================================== */

start();


async function start(){

  setupScene();

  setLoading(
    25,
    'SPIELFELD WIRD GELADEN...'
  );

  createArena();

  createGoals();

  createBall();

  setLoading(
    45,
    'SPIELER WERDEN GELADEN...'
  );

  /*
    WICHTIG:
    Das Spiel wartet NICHT endlos auf das Modell.
  */

  const modelPromise=
    loadPlayerModel();

  const timeout=
    new Promise(resolve=>
      setTimeout(
        ()=>resolve(null),
        3500
      )
    );

  baseModel=
    await Promise.race([
      modelPromise,
      timeout
    ]);

  if(baseModel){

    setLoading(
      80,
      '3D-SPIELER GELADEN...'
    );

  }else{

    setLoading(
      80,
      'SPIELER WERDEN ERSTELLT...'
    );

  }


  createPlayers();

  setupControls();

  window.addEventListener(
    'resize',
    resize
  );


  setLoading(
    100,
    'START...'
  );


  /*
    Kleiner Delay damit der Start
    sauber aussieht.
  */

  setTimeout(
    hideLoading,
    250
  );


  animate();

}


/* =====================================================
   SCENE
===================================================== */

function setupScene(){

  clock=
    new THREE.Clock();


  scene=
    new THREE.Scene();


  scene.background=
    new THREE.Color(
      0x061521
    );


  scene.fog=
    new THREE.Fog(
      0x061521,
      30,
      75
    );


  camera=
    new THREE.PerspectiveCamera(
      48,
      innerWidth/innerHeight,
      .1,
      150
    );


  camera.position.set(
    0,
    13,
    -10
  );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:'high-performance'
    });


  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio,
      1.6
    )
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


  renderer.outputColorSpace=
    THREE.SRGBColorSpace;


  document
    .getElementById('game')
    .appendChild(renderer.domElement);


  const hemi=
    new THREE.HemisphereLight(
      0x9cddff,
      0x08212e,
      2.3
    );

  scene.add(hemi);


  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      3
    );

  sun.position.set(
    -15,
    30,
    10
  );

  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  scene.add(sun);

}


/* =====================================================
   LOAD PLAYER MODEL
===================================================== */

async function loadPlayerModel(){

  try{

    const loader=
      new GLTFLoader();


    const gltf=
      await loader.loadAsync(
        'https://threejs.org/examples/models/gltf/Xbot.glb'
      );


    return gltf.scene;

  }catch(error){

    console.warn(
      '3D-Modell konnte nicht geladen werden:',
      error
    );

    return null;

  }

}


/* =====================================================
   ARENA
===================================================== */

function createArena(){

  const deck=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        33,
        .8,
        27
      ),
      new THREE.MeshStandardMaterial({
        color:0x202a30,
        roughness:.85
      })
    );


  deck.position.y=-.9;

  deck.receiveShadow=true;

  scene.add(deck);


  const water=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        pool.width,
        pool.length,
        50,
        50
      ),
      new THREE.MeshPhysicalMaterial({
        color:0x0878aa,
        transparent:true,
        opacity:.86,
        roughness:.1,
        metalness:.05,
        clearcoat:1
      })
    );


  water.rotation.x=
    -Math.PI/2;

  water.receiveShadow=true;

  scene.add(water);


  const floor=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        pool.width,
        pool.length
      ),
      new THREE.MeshStandardMaterial({
        color:0x086c91,
        roughness:.4
      })
    );


  floor.rotation.x=
    -Math.PI/2;

  floor.position.y=-.06;

  scene.add(floor);


  createFieldLines();


  /* pool lights */

  for(let i=0;i<7;i++){

    const light=
      new THREE.PointLight(
        0x4bc9ff,
        9,
        17
      );

    light.position.set(
      -13+i*4.3,
      4,
      -11
    );

    scene.add(light);

  }

}


/* =====================================================
   FIELD
===================================================== */

function createFieldLines(){

  const material=
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  function line(
    x1,z1,
    x2,z2,
    thickness=.055
  ){

    const length=
      Math.hypot(
        x2-x1,
        z2-z1
      );


    const mesh=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          thickness,
          .025,
          length
        ),
        material
      );


    mesh.position.set(
      (x1+x2)/2,
      .025,
      (z1+z2)/2
    );


    mesh.rotation.y=
      -Math.atan2(
        x2-x1,
        z2-z1
      );


    scene.add(mesh);

  }


  line(
    -12.8,
    -10,
    -12.8,
    10
  );


  line(
    12.8,
    -10,
    12.8,
    10
  );


  line(
    -12.8,
    0,
    12.8,
    0,
    .09
  );


  line(
    -12.8,
    -5,
    12.8,
    -5,
    .075
  );


  line(
    -12.8,
    5,
    12.8,
    5,
    .075
  );


  line(
    -12.8,
    -8,
    12.8,
    -8
  );


  line(
    -12.8,
    8,
    12.8,
    8
  );

}


/* =====================================================
   GOALS
===================================================== */

function createGoals(){

  createGoal(
    -9.7
  );

  createGoal(
    9.7
  );

}


function createGoal(z){

  const material=
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      roughness:.35
    });


  const width=4.8;
  const height=1.35;


  for(const x of[-width/2,width/2]){

    const post=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .08,
          .08,
          height
        ),
        material
      );


    post.position.set(
      x,
      height/2,
      z
    );


    scene.add(post);

  }


  const crossbar=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        .12,
        .12
      ),
      material
    );


  crossbar.position.set(
    0,
    height,
    z
  );


  scene.add(crossbar);


  const net=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        1.15
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        wireframe:true,
        transparent:true,
        opacity:.32
      })
    );


  net.position.set(
    0,
    height/2,
    z+(z>0?.55:-.55)
  );


  scene.add(net);

}


/* =====================================================
   BALL
===================================================== */

function createBall(){

  const ball=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .22,
        24,
        24
      ),
      new THREE.MeshStandardMaterial({
        color:0xf3a522,
        roughness:.5
      })
    );


  ball.castShadow=true;

  ball.position.set(
    0,
    .45,
    3.5
  );


  scene.add(ball);

  ballObjects.push(ball);

}


/* =====================================================
   PLAYERS
===================================================== */

function createPlayers(){

  for(let team=0;team<2;team++){

    for(
      let i=0;
      i<formation.length;
      i++
    ){

      let mesh;


      /*
        Wenn Xbot geladen wurde:
        echten 3D-Menschen benutzen.
      */

      if(baseModel){

        mesh=
          SkeletonUtils.clone(
            baseModel
          );

        mesh.scale.setScalar(
          1.05
        );

        mesh.traverse(
          object=>{

            if(object.isMesh){

              object.castShadow=true;
              object.receiveShadow=true;

            }

          }
        );

      }else{

        /*
          Robuster Fallback.
          Kein Ladefehler mehr.
        */

        mesh=
          createFallbackPlayer(
            team
          );

      }


      const f=
        formation[i];

      const side=
        team===0?1:-1;


      mesh.position.set(
        f.x,
        -.75,
        f.z*side
      );


      mesh.rotation.y=
        team===0
          ? Math.PI
          : 0;


      scene.add(mesh);


      const number=
        team===0 && i===0
          ? 6
          : i+1;


      players.push({

        mesh,

        team,

        position:f.pos,

        number,

        name:
          team===0 && i===0
            ? 'MAX HEINZE'
            : team===0
              ? 'SV LOK'
              : 'SVV PLAUEN',

        stamina:100,

        homeX:f.x,

        homeZ:f.z*side,

        vx:0,

        vz:0,

        speed:2.7,

        sprintSpeed:5

      });

    }

  }


  activePlayer=0;

  ballCarrier=0;

  updatePlayerHUD();

}


/* =====================================================
   FALLBACK PLAYER
===================================================== */

function createFallbackPlayer(team){

  const group=
    new THREE.Group();


  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .34,
        .75,
        6,
        12
      ),
      new THREE.MeshStandardMaterial({
        color:
          team===0
            ? 0x0879c4
            : 0xd33145
      })
    );


  body.position.y=.75;

  body.castShadow=true;

  group.add(body);


  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .28,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0xe2a57c
      })
    );


  head.position.y=1.35;

  head.castShadow=true;

  group.add(head);


  const cap=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .31,
        .31,
        .12,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:
          team===0
            ? 0x1266a8
            : 0xb51f36
      })
    );


  cap.position.y=1.62;

  group.add(cap);


  return group;

}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

  const joystickElement=
    document.getElementById(
      'joystick'
    );


  const stick=
    document.getElementById(
      'stick'
    );


  joystickElement.addEventListener(
    'pointerdown',
    e=>{

      joystick.active=true;

      joystickElement.setPointerCapture(
        e.pointerId
      );

      moveJoystick(e);

    }
  );


  joystickElement.addEventListener(
    'pointermove',
    e=>{

      if(
        joystick.active
      )
        moveJoystick(e);

    }
  );


  joystickElement.addEventListener(
    'pointerup',
    resetJoystick
  );


  joystickElement.addEventListener(
    'pointercancel',
    resetJoystick
  );


  function moveJoystick(e){

    const r=
      joystickElement.getBoundingClientRect();


    const cx=
      r.left+r.width/2;

    const cy=
      r.top+r.height/2;


    let x=
      e.clientX-cx;

    let y=
      e.clientY-cy;


    const radius=
      r.width*.34;


    const length=
      Math.hypot(x,y);


    if(length>radius){

      x=x/length*radius;
      y=y/length*radius;

    }


    joystick.x=x/radius;
    joystick.y=y/radius;


    stick.style.transform=
      `translate(${x}px,${y}px)`;

  }


  function resetJoystick(){

    joystick.active=false;

    joystick.x=0;
    joystick.y=0;

    stick.style.transform=
      'translate(0,0)';

  }


  holdButton(
    'sprint',
    ()=>{
      sprinting=true;
    },
    ()=>{
      sprinting=false;
    }
  );


  clickButton(
    'pass',
    passBall
  );


  clickButton(
    'shoot',
    shootBall
  );


  clickButton(
    'switch',
    switchPlayer
  );


  window.addEventListener(
    'keydown',
    e=>{

      keys[
        e.key.toLowerCase()
      ]=true;


      if(e.key==='Shift')
        sprinting=true;


      if(e.key==='e')
        switchPlayer();


      if(e.key==='q')
        passBall();


      if(e.key===' ')
        shootBall();

    }
  );


  window.addEventListener(
    'keyup',
    e=>{

      keys[
        e.key.toLowerCase()
      ]=false;


      if(e.key==='Shift')
        sprinting=false;

    }
  );

}


function clickButton(
  id,
  action
){

  const button=
    document.getElementById(id);


  button.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      action();

    }
  );

}


function holdButton(
  id,
  down,
  up
){

  const button=
    document.getElementById(id);


  button.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      down();

    }
  );


  button.addEventListener(
    'pointerup',
    up
  );


  button.addEventListener(
    'pointercancel',
    up
  );

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(delta){

  if(!players.length)
    return;


  const p=
    players[activePlayer];


  let x=
    joystick.x;

  let z=
    joystick.y;


  if(
    keys['w']||
    keys['arrowup']
  )
    z=-1;


  if(
    keys['s']||
    keys['arrowdown']
  )
    z=1;


  if(
    keys['a']||
    keys['arrowleft']
  )
    x=-1;


  if(
    keys['d']||
    keys['arrowright']
  )
    x=1;


  const length=
    Math.hypot(x,z);


  if(length>1){

    x/=length;
    z/=length;

  }


  const moving=
    Math.abs(x)+Math.abs(z)>.05;


  const sprint=
    sprinting &&
    p.stamina>1 &&
    moving;


  const speed=
    sprint
      ? p.sprintSpeed
      : p.speed;


  if(sprint){

    p.stamina=
      Math.max(
        0,
        p.stamina-
        delta*11
      );

  }else{

    p.stamina=
      Math.min(
        100,
        p.stamina+
        delta*
        (moving?3.5:6)
      );

  }


  if(moving){

    p.mesh.position.x+=
      x*speed*delta;


    p.mesh.position.z+=
      z*speed*delta;


    p.mesh.rotation.y=
      Math.atan2(
        x,
        z
      );


    p.vx=x;
    p.vz=z;

  }


  p.mesh.position.x=
    THREE.MathUtils.clamp(
      p.mesh.position.x,
      -12,
      12
    );


  p.mesh.position.z=
    THREE.MathUtils.clamp(
      p.mesh.position.z,
      -9,
      9
    );


  if(
    ballCarrier===activePlayer
  ){

    const ball=
      ballObjects[0];


    ball.position.set(
      p.mesh.position.x+
      p.vx*.45,
      .45,
      p.mesh.position.z+
      p.vz*.45
    );

  }


  updatePlayerHUD();

}


/* =====================================================
   AI
===================================================== */

function updateAI(delta){

  if(!players.length)
    return;


  const ball=
    ballObjects[0];


  for(
    let i=0;
    i<players.length;
    i++
  ){

    const p=
      players[i];


    if(
      p.team===0 &&
      i===activePlayer
    )
      continue;


    if(p.position==='GK'){

      const goalZ=
        p.team===0
          ? -7.5
          : 7.5;


      const targetX=
        THREE.MathUtils.clamp(
          ball.position.x,
          -2,
          2
        );


      p.mesh.position.x+=
        (targetX-
         p.mesh.position.x)*
        delta*2;


      p.mesh.position.z+=
        (goalZ-
         p.mesh.position.z)*
        delta*2;


      continue;

    }


    const dx=
      ball.position.x-
      p.mesh.position.x;


    const dz=
      ball.position.z-
      p.mesh.position.z;


    const distance=
      Math.hypot(
        dx,
        dz
      );


    if(
      p.team===1 &&
      distance<7
    ){

      const len=
        Math.max(
          .01,
          distance
        );


      p.mesh.position.x+=
        dx/len*
        2.05*
        delta;


      p.mesh.position.z+=
        dz/len*
        2.05*
        delta;

    }else{

      p.mesh.position.x+=
        (p.homeX-
         p.mesh.position.x)*
        delta*1.25;


      p.mesh.position.z+=
        (p.homeZ-
         p.mesh.position.z)*
        delta*1.25;

    }

  }

}


/* =====================================================
   PASS
===================================================== */

function passBall(){

  if(
    ballCarrier!==activePlayer
  )
    return;


  const current=
    players[activePlayer];


  let target=-1;

  let best=Infinity;


  for(
    let i=0;
    i<7;
    i++
  ){

    if(i===activePlayer)
      continue;


    const p=
      players[i];


    const d=
      Math.hypot(
        p.mesh.position.x-
        current.mesh.position.x,

        p.mesh.position.z-
        current.mesh.position.z
      );


    if(d<best){

      best=d;
      target=i;

    }

  }


  if(target<0)
    return;


  ballCarrier=target;

  activePlayer=target;


  ballObjects[0].position.set(
    players[target].mesh.position.x,
    .45,
    players[target].mesh.position.z
  );


  showMessage(
    'PASS → '+
    players[target].position
  );


  updatePlayerHUD();

}


/* =====================================================
   SHOOT
===================================================== */

function shootBall(){

  if(
    ballCarrier!==activePlayer
  )
    return;


  const shooter=
    players[activePlayer];


  const ball=
    ballObjects[0];


  const targetZ=
    shooter.team===0
      ? 9.65
      : -9.65;


  const start=
    ball.position.clone();


  const target=
    new THREE.Vector3(
      THREE.MathUtils.clamp(
        shooter.mesh.position.x,
        -2.1,
        2.1
      ),
      .55,
      targetZ
    );


  const duration=
    THREE.MathUtils.clamp(
      Math.abs(
        targetZ-
        start.z
      )/15,
      .45,
      1.1
    );


  const startTime=
    performance.now();


  ballCarrier=-1;


  function shot(){

    const t=
      Math.min(
        1,
        (performance.now()-
         startTime)/
        (duration*1000)
      );


    const smooth=
      1-Math.pow(1-t,3);


    ball.position.lerpVectors(
      start,
      target,
      smooth
    );


    ball.position.y=
      .45+
      Math.sin(t*Math.PI)*
      1.5;


    if(t<1){

      requestAnimationFrame(
        shot
      );

    }else{

      checkGoal(
        shooter.team,
        ball.position
      );

    }

  }


  shot();


  showMessage('WURF!');

}


/* =====================================================
   GOAL
===================================================== */

function checkGoal(
  team,
  position
){

  let goal=false;


  if(
    team===0 &&
    position.z>9.2 &&
    Math.abs(position.x)<2.4
  ){

    homeScore++;

    goal=true;

  }


  if(
    team===1 &&
    position.z<-9.2 &&
    Math.abs(position.x)<2.4
  ){

    awayScore++;

    goal=true;

  }


  if(goal){

    document.getElementById(
      'homeScore'
    ).textContent=
      homeScore;


    document.getElementById(
      'awayScore'
    ).textContent=
      awayScore;


    showMessage(
      team===0
        ? '🥅 TOR SV LOK GÖRLITZ!'
        : '🥅 TOR SVV PLAUEN!'
    );


    setTimeout(
      resetGame,
      1200
    );

  }else{

    ballCarrier=
      activePlayer;


    ball.position.set(
      players[activePlayer]
        .mesh.position.x,
      .45,
      players[activePlayer]
        .mesh.position.z
    );

  }

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  for(
    let i=0;
    i<players.length;
    i++
  ){

    const p=
      players[i];


    p.mesh.position.set(
      p.homeX,
      -.75,
      p.homeZ
    );

  }


  activePlayer=0;

  ballCarrier=0;


  ballObjects[0].position.set(
    0,
    .45,
    3.5
  );


  updatePlayerHUD();

}


/* =====================================================
   SWITCH PLAYER
===================================================== */

function switchPlayer(){

  if(!players.length)
    return;


  const current=
    players[activePlayer];


  let target=-1;
  let distance=Infinity;


  for(
    let i=0;
    i<7;
    i++
  ){

    if(i===activePlayer)
      continue;


    const p=
      players[i];


    const d=
      Math.hypot(
        p.mesh.position.x-
        current.mesh.position.x,

        p.mesh.position.z-
        current.mesh.position.z
      );


    if(d<distance){

      distance=d;
      target=i;

    }

  }


  if(target>=0){

    activePlayer=target;


    showMessage(
      'SPIELER → '+
      players[target].position
    );


    updatePlayerHUD();

  }

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(delta){

  if(!players.length)
    return;


  const p=
    players[activePlayer];


  const desired=
    new THREE.Vector3(
      p.mesh.position.x,
      12.5,
      p.mesh.position.z-11
    );


  camera.position.lerp(
    desired,
    1-Math.pow(
      .001,
      delta
    )
  );


  camera.lookAt(
    p.mesh.position.x,
    0,
    p.mesh.position.z
  );

}


/* =====================================================
   HUD
===================================================== */

function updatePlayerHUD(){

  if(!players.length)
    return;


  const p=
    players[activePlayer];


  document.getElementById(
    'playerName'
  ).textContent=
    p.name;


  document.getElementById(
    'playerPosition'
  ).textContent=
    `${p.position} · #${p.number}`;


  const bar=
    document.getElementById(
      'stamina'
    );


  bar.style.width=
    `${p.stamina}%`;


  if(p.stamina<25){

    bar.style.background=
      '#ff4b5c';

  }else if(p.stamina<50){

    bar.style.background=
      '#ffc52e';

  }else{

    bar.style.background=
      '#39e879';

  }

}


/* =====================================================
   MATCH CLOCK
===================================================== */

function updateClock(delta){

  gameTime+=delta;


  const total=
    Math.floor(
      gameTime
    );


  const min=
    Math.floor(
      total/60
    );


  const sec=
    total%60;


  document.getElementById(
    'matchTime'
  ).textContent=
    `1. Viertel · ${
      String(min).padStart(2,'0')
    }:${
      String(sec).padStart(2,'0')
    }`;

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimeout;


function showMessage(text){

  const element=
    document.getElementById(
      'message'
    );


  element.textContent=text;

  element.classList.add(
    'show'
  );


  clearTimeout(
    messageTimeout
  );


  messageTimeout=
    setTimeout(
      ()=>{
        element.classList.remove(
          'show'
        );
      },
      900
    );

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  percent,
  text
){

  document.getElementById(
    'loadbar'
  ).style.width=
    percent+'%';


  document.getElementById(
    'loadtext'
  ).textContent=
    text;

}


function hideLoading(){

  const loading=
    document.getElementById(
      'loading'
    );


  loading.classList.add(
    'hide'
  );


  setTimeout(
    ()=>{
      loading.style.display='none';
    },
    600
  );

}


/*
  ABSOLUTER NOTFALL:
  Selbst wenn irgendwo ein Fehler passiert,
  wird der Loading-Screen nach 5 Sekunden
  entfernt.
*/

setTimeout(
  ()=>{
    const loading=
      document.getElementById(
        'loading'
      );

    if(
      loading &&
      loading.style.display!=='none'
    ){

      loading.classList.add(
        'hide'
      );

      setTimeout(
        ()=>{
          loading.style.display='none';
        },
        600
      );

    }

  },
  5000
);


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  if(!renderer)
    return;


  camera.aspect=
    innerWidth/
    innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );

}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );


  updatePlayer(delta);

  updateAI(delta);

  updateCamera(delta);

  updateClock(delta);


  renderer.render(
    scene,
    camera
  );

}

</script>

</html>
