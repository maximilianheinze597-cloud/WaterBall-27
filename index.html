<!doctype html>
<html lang="de">
<head>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06131f;
  color:white;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
}

#app {
  position:fixed;
  inset:0;
  overflow:hidden;
}

#game {
  position:absolute;
  inset:0;
}

canvas {
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* ================= HUD ================= */

#hud {
  position:absolute;
  inset:0;
  pointer-events:none;
}

.topbar {
  position:absolute;
  top:0;
  left:0;
  right:0;

  padding:
    max(12px,env(safe-area-inset-top))
    16px
    0;

  display:flex;
  justify-content:center;
}

.score {
  display:flex;
  align-items:center;
  gap:18px;

  padding:10px 18px;

  border:1px solid #ffffff22;
  border-radius:16px;

  background:#06121dcc;
  backdrop-filter:blur(12px);

  box-shadow:0 10px 30px #0005;

  font-weight:800;
}

.team {
  min-width:92px;
  text-align:center;
}

.blue {
  color:#64b8ff;
}

.red {
  color:#ff7180;
}

.goals {
  font-size:28px;
  letter-spacing:3px;
}

.clock {
  font-size:13px;
  color:#b9c8d4;
  text-align:center;
}

.player-card {
  position:absolute;

  left:16px;
  top:90px;

  width:210px;

  padding:12px 14px;

  border-radius:15px;

  background:#06121dcc;
  border:1px solid #ffffff1c;

  backdrop-filter:blur(10px);
}

.name {
  font-weight:900;
  letter-spacing:.4px;
}

.position {
  color:#9fb2c1;
  font-size:12px;
}

.statrow {
  display:flex;
  justify-content:space-between;

  font-size:12px;

  margin-top:8px;
}

.bar {
  height:5px;

  background:#ffffff1a;

  border-radius:9px;

  overflow:hidden;

  margin-top:5px;
}

.bar > i {
  display:block;

  height:100%;
  width:76%;

  background:white;

  border-radius:9px;
}

.help {
  position:absolute;

  right:16px;
  top:90px;

  padding:10px 12px;

  border-radius:12px;

  background:#06121dcc;
  border:1px solid #ffffff1c;

  color:#b9c8d4;

  font-size:12px;

  line-height:1.5;
}

/* ================= TOUCH ================= */

#touchUI {
  position:absolute;
  inset:0;

  pointer-events:none;
}

#joystick {
  position:absolute;

  left:max(18px,env(safe-area-inset-left));
  bottom:max(22px,env(safe-area-inset-bottom));

  width:132px;
  height:132px;

  border-radius:50%;

  background:#ffffff14;
  border:2px solid #ffffff2b;

  pointer-events:auto;
}

#stick {
  position:absolute;

  left:50%;
  top:50%;

  width:58px;
  height:58px;

  margin:-29px;

  border-radius:50%;

  background:#ffffff35;
  border:1px solid #ffffff66;

  box-shadow:0 5px 20px #0004;
}

.actions {
  position:absolute;

  right:max(18px,env(safe-area-inset-right));
  bottom:max(24px,env(safe-area-inset-bottom));

  display:flex;
  gap:12px;

  align-items:end;

  pointer-events:auto;
}

.btn {
  width:82px;
  height:82px;

  border-radius:50%;

  border:1px solid #ffffff55;

  color:white;

  background:#071522dd;

  font-weight:900;
  font-size:13px;

  box-shadow:0 8px 24px #0005;

  touch-action:none;
}

.btn:active {
  transform:scale(.94);
}

.shoot {
  width:94px;
  height:94px;

  background:#ffffff22;
}

/* Vollbild */

#fullscreen {
  position:absolute;

  right:16px;
  bottom:16px;

  pointer-events:auto;

  border:1px solid #ffffff30;

  background:#06121dcc;

  color:white;

  border-radius:10px;

  padding:8px 10px;

  font-size:16px;
}

/* Meldungen */

#message {
  position:absolute;

  left:50%;
  top:54%;

  transform:translate(-50%,-50%);

  padding:12px 18px;

  border-radius:14px;

  background:#06121de8;

  border:1px solid #ffffff25;

  font-weight:900;

  opacity:0;

  transition:.2s;
}

#message.show {
  opacity:1;
}

/* ================= MOBILE ================= */

@media (pointer:fine) {

  #touchUI {
    display:none;
  }

}

@media (max-width:700px) {

  .player-card {
    top:82px;
    left:10px;

    width:170px;

    padding:9px 11px;
  }

  }

  }

  }

}

@media
(orientation:portrait)
and (pointer:coarse) {

  }

  }

  #joystick {
    width:118px;
    height:118px;
  }

  #stick {

    height:52px;
    margin:-26px;
  }

  .btn {
    width:72px;
    height:72px;
  }

  .shoot {
    width:84px;
    height:84px;
  }

}

/* =========================================================
   WASSERBALL-KAPPEN
========================================================= */

function capTexture(
  number,
  color
) {

  const canvas =
  document.createElement("canvas");

  canvas.width=256;
  canvas.height=128;

  const ctx =
  canvas.getContext("2d");

  ctx.fillStyle=color;

  ctx.fillRect(
    0,
    0,
    256,
    128
  );

  ctx.fillStyle="#fff";

  ctx.font="900 82px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText(
    number,
    128,
    66
  );

  return new THREE.CanvasTexture(
    canvas
  );

}


/* =========================================================
   SPIELER
========================================================= */

function player({
  x,
  z,
  color,
  number,
  goalie=false,
  name="PLAYER"
}) {

  const group =
  new THREE.Group();

  group.position.set(
    x,
    .35,
    z
  );


  const skin =
  mat(0xd49a72);

  const body =
  mat(color);

  const dark =
  mat(0x101820);


  /* Körper */

  const torso =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .48,
      .72,
      6,
      12
    ),
    body
  );

  torso.scale.set(
    .95,
    1,
    .65
  );

  torso.castShadow=true;

  group.add(torso);


  /* Kopf */

  const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .34,
      16,
      12
    ),
    skin
  );

  head.position.y=.9;

  head.castShadow=true;

  group.add(head);


  /* Wasserball-Kappe */

  const cap =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .39,
      20,
      12,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),

    new THREE.MeshStandardMaterial({
      color:
        goalie
        ? 0xc51d32
        : color,

      map:
        capTexture(
          number,
          goalie
          ? "#c51d32"
          : color
        )
    })
  );

  cap.position.y=1.06;

  group.add(cap);


  /* Ohrschutz */

  const earL =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .10,
      .10,
      .05,
      12
    ),
    dark
  );

  earL.rotation.z=
    Math.PI/2;

  earL.position.set(
    -.37,
    1.02,
    0
  );

  group.add(earL);


  const earR =
  earL.clone();

  earR.position.x=.37;

  group.add(earR);


  /* Arme */

  for(
    const sx of [-.24,.24]
  ) {

    const arm =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .12,
        .58,
        5,
        8
      ),
      skin
    );

    arm.position.set(
      sx,
      .35,
      0
    );

    arm.rotation.z =
      sx < 0
      ? -.5
      : .5;

    arm.castShadow=true;

    group.add(arm);

  }


  /* Badehose */

  const trunks =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .85,
      .22,
      .55
    ),
    dark
  );

  trunks.position.y=-.25;

  group.add(trunks);


  group.userData = {

    number,
    name,
    goalie,

    velocity:
      new THREE.Vector3(),

    stamina:100

  };


  scene.add(group);

  return group;

}

   INPUT
========================================================= */

const input = {

/* =========================================================
   TOUCH BUTTONS
========================================================= */

function action(
  selector,
  type
) {

  const button =
  document.querySelector(selector);

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      input[type]=true;

      button.setPointerCapture?.(
        e.pointerId
      );

    }
  );

}

/* =========================================================
   VIRTUELLER JOYSTICK
========================================================= */

const joystick =
document.querySelector(
  "#joystick"
);

const stick =
document.querySelector(
  "#stick"
);

let joyId=null;


function joyMove(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left+r.width/2;

  const cy =
    r.top+r.height/2;


  let dx =
    e.clientX-cx;

  let dy =
    e.clientY-cy;


  const limit =
    r.width*.34;


  const length =
    Math.hypot(
      dx,
      dy
    );


  if(length>limit){

    dx =
      dx/length*limit;

    dy =
      dy/length*limit;

  }


  stick.style.transform =
    `translate(${dx}px,${dy}px)`;


  input.x=dx/limit;

  input.z=dy/limit;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joyId=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    joyMove(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===joyId
    ){

      joyMove(e);

    }

  }
);


function joyUp(e){

  if(
    e.pointerId!==joyId
  ) return;

  joyId=null;

  stick.style.transform =
    "translate(0,0)";

  input.x=0;
  input.z=0;

}


joystick.addEventListener(
  "pointerup",
  joyUp
);

joystick.addEventListener(
  "pointercancel",
  joyUp
);

========================================================= */

document

.onclick=async()=>{

/* =========================================================
   RESPONSIVE RENDERING
========================================================= */

function responsive(){

  const width =
    game.clientWidth;

  const height =
    game.clientHeight;

  const aspect =
    width/height;


  renderer.setSize(
    width,
    height,
    false
  );


  camera.aspect =
    aspect;


  if(aspect<.72){

    camera.fov=72;

  }

  else if(aspect<1){

    camera.fov=66;

  }

  else if(aspect<1.45){

    camera.fov=61;

  }

  else{

    camera.fov=54;

  }


  camera.updateProjectionMatrix();

}


new ResizeObserver(
  responsive
).observe(game);

responsive();


/* =========================================================
   MATCH
========================================================= */

let blue=0;

let red=0;

let time=480;

let last=
performance.now();


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

  const message =
    document.querySelector(
      "#message"
    );

  message.textContent=text;

  message.classList.add(
    "show"
  );

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer =
    setTimeout(
      ()=>{
        message.classList.remove(
          "show"
        );
      },
      1000
    );

}


/* =========================================================
   SCHUSS
========================================================= */

function shoot(){

  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    )
    .applyQuaternion(
      me.quaternion
    );


  direction.y=.08;


  ball.position.copy(
    me.position
  );


  ball.position.y+=.25;


  ball.position.add(
    direction.clone()
    .multiplyScalar(.8)
  );


  ballVel.copy(
    direction
    .normalize()
    .multiplyScalar(11)
  );


  showMessage(
    "SCHUSS!"
  );

}


/* =========================================================
   PASS
========================================================= */

function pass(){

  let target =
    mates.reduce(
      (a,b)=>
        me.position.distanceTo(b.position)
        <
        me.position.distanceTo(a.position)
        ? b
        : a,
      mates[0]
    );


  const direction =
    target.position
    .clone()
    .sub(me.position)
    .normalize();


  direction.y=.03;


  ball.position.copy(
    me.position
  );

  ball.position.y+=.25;


  ballVel.copy(
    direction.multiplyScalar(8)
  );


  showMessage(
    "PASS!"
  );

}


/* =========================================================
   BALL ZURÜCKSETZEN
========================================================= */

function resetBall(team){

  ballVel.set(
    0,
    0,
    0
  );


  if(team==="blue"){

    ball.position.set(
      -3,
      .35,
      0
    );

  }else{

    ball.position.set(
      3,
      .35,
      0
    );

  }

}


/* =========================================================
   SPIELER BEWEGEN
========================================================= */

function movePlayer(
  p,
  dx,
  dz,
  dt
){

  const velocity =
    new THREE.Vector3(
      dx,
      0,
      dz
    );


  if(
    velocity.lengthSq()>1
  ){

    velocity.normalize();

  }


  const sprint =
    keys["shift"] &&
    p===me
    ? 1.25
    : 1;


  const speed =
    (p===me ? 3.7 : 2.4)
    *sprint;


  p.position.addScaledVector(
    velocity,
    speed*dt
  );


  p.position.x =
    THREE.MathUtils.clamp(
      p.position.x,
      -13.5,
      13.5
    );


  p.position.z =
    THREE.MathUtils.clamp(
      p.position.z,
      -8.5,
      8.5
    );


  if(
    velocity.lengthSq()>.01
  ){

    p.rotation.y =
      Math.atan2(
        velocity.x,
        velocity.z
      );

  }

}


/* =========================================================
   KI
========================================================= */

function ai(dt){

  [
    ...mates,
    ...enemies
  ].forEach(
    p=>{

      let target;


      if(
        p.userData.name
        .startsWith("RED")
      ){

        target =
          new THREE.Vector3(
            0,
            0,
            0
          );

      }else{

        target =
          ball.position;

      }


      let dx =
        target.x-
        p.position.x;


      let dz =
        target.z-
        p.position.z;


      if(
        p.userData.goalie
      ){

        dx=0;

        dz =
          ball.position.z-
          p.position.z;

      }


      movePlayer(
        p,
        dx,
        dz,
        dt
      );

    }
  );

}


/* =========================================================
   KAMERA
========================================================= */

function updateCamera(){

  const aspect =
    game.clientWidth/
    game.clientHeight;


  if(aspect<.8){

    camera.position.lerp(

      new THREE.Vector3(
        me.position.x*.25,
        12.5,
        me.position.z*.25+12.5
      ),

      .08

    );

  }

  else{

    camera.position.lerp(

      new THREE.Vector3(
        me.position.x*.42+2,
        8.2,
        me.position.z*.28+12.2
      ),

      .08

    );

  }


  camera.lookAt(
    me.position.x*.35,
    0,
    me.position.z*.2
  );

}


/* =========================================================
   TORERKENNUNG
========================================================= */

function scoreCheck(){

  if(
    ball.position.z>9.2
  ){

    blue++;

    document
      .querySelector(
        "#blueScore"
      )
      .textContent=blue;

    showMessage(
      "TOR BLUE!"
    );

    resetBall("red");

  }


  if(
    ball.position.z<-9.2
  ){

    red++;

    document
      .querySelector(
        "#redScore"
      )
      .textContent=red;

    showMessage(
      "TOR RED!"
    );

    resetBall("blue");

  }

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  requestAnimationFrame(
    loop
  );


  const dt =
    Math.min(
      (now-last)/1000,
      .033
    );


  last=now;


  /* Tastatur */

  let kx =
    (keys["d"] ||
     keys["arrowright"]
     ? 1
     : 0)
    -
    (keys["a"] ||
     keys["arrowleft"]
     ? 1
     : 0);


  let kz =
    (keys["s"] ||
     keys["arrowdown"]
     ? 1
     : 0)
    -
    (keys["w"] ||
     keys["arrowup"]
     ? 1
     : 0);


  /* Touch */

  if(
    Math.abs(input.x)+
    Math.abs(input.z)>.05
  ){

    kx=input.x;

    kz=input.z;

  }


  movePlayer(
    me,
    kx,
    kz,
    dt
  );


  ai(dt);


  if(input.pass){

    pass();

    input.pass=false;

  }


  if(input.shoot){

    shoot();

    input.shoot=false;

  }


  /* Ball */

  ball.position.addScaledVector(
    ballVel,
    dt
  );


  ballVel.multiplyScalar(
    Math.pow(.07,dt)
  );


  ball.position.y =
    .27+
    Math.abs(
      Math.sin(now*.008)
    )*.035;


  /* Spielfeldgrenzen */

  if(
    ball.position.x<-14 ||
    ball.position.x>14 ||
    ball.position.z<-10 ||
    ball.position.z>10
  ){

    resetBall(
      ball.position.x<0
      ? "blue"
      : "red"
    );

  }


  scoreCheck();


  /* Zeit */

  time =
    Math.max(
      0,
      time-dt
    );


  const minutes =
    String(
      Math.floor(time/60)
    ).padStart(2,"0");


  const seconds =
    String(
      Math.floor(time%60)
    ).padStart(2,"0");


  document
    .querySelector(
      "#clock"
    )
    .textContent =
      minutes+
      ":"+
      seconds;


  /* Ausdauer */

  me.userData.stamina =
    Math.max(
      0,
      me.userData.stamina-
      (
        Math.hypot(kx,kz)>1.1
        ? 12
        : 2
      )*dt
    );


  if(
    Math.hypot(kx,kz)<.2
  ){

    me.userData.stamina =
      Math.min(
        100,
        me.userData.stamina+
        7*dt
      );

  }


  document
    .querySelector(
      "#staminaBar"
    )
    .style.width =
      me.userData.stamina+
      "%";


  document
    .querySelector(
      "#staminaText"
    )
    .textContent =
      Math.round(
        me.userData.stamina
      )+
      "%";


  updateCamera();


  renderer.render(
    scene,
    camera
  );

}


showMessage(
  "WATERBALL 27"
);


requestAnimationFrame(
  loop
);

</script>
