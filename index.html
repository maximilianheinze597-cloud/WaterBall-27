<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>WATERBALL 27</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07131e;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(720px,94vw);
    height:70px;
    border-radius:18px;
    background:rgba(4,11,18,.82);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    color:white;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 16px;
    pointer-events:none;
}

.team{
    width:31%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
}

.team-name{
    font-size:12px;
    font-weight:800;
    letter-spacing:.8px;
    opacity:.8;
}

.score{
    font-size:28px;
    font-weight:900;
}

#clock{
    width:25%;
    text-align:center;
    font-size:18px;
    font-weight:800;
}

#pos{
    position:fixed;
    top:91px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(4,11,18,.65);
    padding:6px 12px;
    border-radius:12px;
    font-size:12px;
    z-index:10;
    pointer-events:none;
}

#staminaBox{
    position:fixed;
    top:91px;
    right:15px;
    width:150px;
    height:25px;
    border-radius:20px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.15);
    overflow:hidden;
    z-index:10;
    pointer-events:none;
}

#stamina{
    width:100%;
    height:100%;
    background:#40d96d;
    transition:width .08s linear;
}

#staminaText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:10px;
    font-weight:bold;
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.20);
    box-shadow:inset 0 0 30px rgba(0,0,0,.18);
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:64px;
    height:64px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.32);
    border:2px solid rgba(255,255,255,.45);
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    pointer-events:none;
}

#actions{
    position:absolute;
    right:25px;
    bottom:25px;
    width:190px;
    height:190px;
    pointer-events:none;
}

.action{
    position:absolute;
    width:74px;
    height:74px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    color:white;
    font-weight:900;
    font-size:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
    touch-action:none;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.action:active{
    transform:scale(.92);
}

#pass{
    left:0;
    top:58px;
    background:rgba(35,140,255,.70);
}

#shoot{
    right:0;
    top:8px;
    background:rgba(245,75,65,.80);
}

#sprint{
    right:0;
    bottom:0;
    background:rgba(60,190,105,.78);
}

#switch{
    left:8px;
    bottom:0;
    background:rgba(150,90,220,.78);
}

#message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.9);
    padding:18px 28px;
    border-radius:20px;
    background:rgba(0,0,0,.82);
    color:white;
    font-size:25px;
    font-weight:900;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

#message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* =========================
   START
========================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at 50% 20%,rgba(30,130,220,.35),transparent 40%),
        linear-gradient(180deg,#06101b,#03101a);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

#startScreen h1{
    margin:0;
    font-size:clamp(42px,11vw,90px);
    letter-spacing:-3px;
    font-weight:1000;
}

#startScreen .sub{
    margin-top:5px;
    opacity:.65;
    letter-spacing:3px;
    font-weight:bold;
}

#startButton{
    margin-top:38px;
    padding:18px 45px;
    border:none;
    border-radius:18px;
    background:#1485ff;
    color:white;
    font-size:18px;
    font-weight:900;
    box-shadow:0 12px 35px rgba(20,133,255,.35);
    touch-action:manipulation;
}

#startButton:active{
    transform:scale(.95);
}

.info{
    margin-top:20px;
    font-size:12px;
    opacity:.55;
    max-width:320px;
    line-height:1.5;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="team">
        <div class="team-name">SV LOK GÖRLITZ</div>
        <div class="score" id="homeScore">0</div>
    </div>

    <div id="clock">04:00</div>

    <div class="team">
        <div class="team-name">GUESTS</div>
        <div class="score" id="awayScore">0</div>
    </div>
</div>

<div id="pos">CF · LOK U16/U14</div>

<div id="staminaBox">
    <div id="stamina"></div>
    <div id="staminaText">AUSDAUER</div>
</div>

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">

        <div class="action" id="pass">
            PASS
        </div>

        <div class="action" id="shoot">
            WURF
        </div>

        <div class="action" id="sprint">
            SPRINT
        </div>

        <div class="action" id="switch">
            WECHSEL
        </div>

    </div>

</div>

<div id="message"></div>

<div id="startScreen">
    <h1>WATERBALL 27</h1>
    <div class="sub">SV LOK GÖRLITZ EDITION</div>

    <button id="startButton">
        SPIEL STARTEN
    </button>

    <div class="info">
        Mobile Wasserball · Querformat empfohlen<br>
        Joystick = Schwimmen · PASS = Zuspiel · WURF = Torwurf
    </div>
</div>

<script>

/* =========================================================
   WATERBALL 27
   Zero dependency Canvas game
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;

    const dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize", resize);
resize();

/* =========================================================
   FIELD
========================================================= */

const FIELD_W = 30;
const FIELD_H = 20;

const GOAL_W = 3.0;

const goalDepth = 1.1;

const field = {
    x:0,
    y:0,
    w:FIELD_W,
    h:FIELD_H
};

/* Fixed camera.
   IMPORTANT:
   Camera never follows player.
   This prevents the goals from moving.
*/

function scale(){
    return Math.min(
        (W - 35) / FIELD_W,
        (H - 125) / FIELD_H
    );
}

function fieldScreenX(x){
    return W/2 + (x - FIELD_W/2) * scale();
}

function fieldScreenY(y){
    return 75 + y * scale();
}

/* =========================================================
   PLAYER
========================================================= */

function player(id, team, pos, x, y, color, label){

    return {
        id,
        team,
        pos,

        x,
        y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        color,
        label,

        stamina:100,

        hasBall:false,

        aiTimer:0,

        radius:.48
    };
}

/*
   SV Lok mixed U14/U16 roster.
   Labels instead of public minor profiles.
*/

const home = [

    player(0,"home","TW",1.3,10,"#f5c542","LOK U16 #1"),

    player(1,"home","LB",6.0,5.0,"#ffd447","LOK U14 #2"),
    player(2,"home","CB",5.0,10.0,"#ffd447","LOK U16 #3"),
    player(3,"home","RB",6.0,15.0,"#ffd447","LOK U16 #4"),

    player(4,"home","LW",10.5,5.5,"#ffd447","LOK U14 #5"),
    player(5,"home","CF",13.5,10,"#ffffff","MAX HEINZE"),
    player(6,"home","RW",10.5,14.5,"#ffd447","LOK U14 #7")

];

const away = [

    player(20,"away","TW",28.7,10,"#e94b5f","GUEST #1"),

    player(21,"away","LB",24,5,"#ef5364","GUEST #2"),
    player(22,"away","CB",25,10,"#ef5364","GUEST #3"),
    player(23,"away","RB",24,15,"#ef5364","GUEST #4"),

    player(24,"away","LW",19.5,5.5,"#ef5364","GUEST #5"),
    player(25,"away","CF",16.5,10,"#ef5364","GUEST #6"),
    player(26,"away","RW",19.5,14.5,"#ef5364","GUEST #7")

];

const players = [...home,...away];

let active = home[5];

/* =========================================================
   BALL
========================================================= */

const ball = {

    x:15,
    y:10,

    vx:0,
    vy:0,

    owner:null,

    radius:.23,

    passTarget:null
};

/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let homeScore = 0;
let awayScore = 0;

let gameSeconds = 240;

let sprinting = false;

let shooting = false;

let shotCharge = 0;

let lastTime = performance.now();

let goalCooldown = 0;

/* =========================================================
   JOYSTICK
========================================================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickPointer = null;

let joyX = 0;
let joyY = 0;

function updateJoystick(e){

    const r = joystick.getBoundingClientRect();

    let x = e.clientX - (r.left + r.width/2);
    let y = e.clientY - (r.top + r.height/2);

    const max = r.width/2 - 32;

    const len = Math.hypot(x,y);

    if(len > max){

        x = x / len * max;
        y = y / len * max;

    }

    joyX = x / max;
    joyY = y / max;

    stick.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}

function resetJoystick(){

    joystickPointer = null;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
        "translate(-50%,-50%)";
}

joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joystickPointer = e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e);

});

joystick.addEventListener("pointermove",e=>{

    if(e.pointerId !== joystickPointer) return;

    e.preventDefault();

    updateJoystick(e);

});

joystick.addEventListener("pointerup",e=>{

    if(e.pointerId === joystickPointer){

        resetJoystick();

    }

});

joystick.addEventListener("pointercancel",resetJoystick);

/* =========================================================
   ACTION BUTTONS
========================================================= */

const passButton = document.getElementById("pass");
const shootButton = document.getElementById("shoot");
const sprintButton = document.getElementById("sprint");
const switchButton = document.getElementById("switch");

/* PASS */

passButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    passBall();

});

/* SPRINT */

sprintButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    sprinting = true;

});

function stopSprint(){

    sprinting = false;

}

sprintButton.addEventListener("pointerup",stopSprint);
sprintButton.addEventListener("pointercancel",stopSprint);
sprintButton.addEventListener("pointerleave",e=>{

    if(e.buttons === 0) sprinting = false;

});

/* SHOOT */

shootButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    shooting = true;

    shotCharge = 0;

});

function releaseShot(){

    if(!shooting) return;

    shooting = false;

    shootBall(shotCharge);

    shotCharge = 0;

}

shootButton.addEventListener("pointerup",releaseShot);
shootButton.addEventListener("pointercancel",releaseShot);

/* PLAYER SWITCH */

switchButton.addEventListener("pointerdown",e=>{

    e.preventDefault();

    switchPlayer();

});

/* =========================================================
   PLAYER SWITCH
========================================================= */

function switchPlayer(){

    let candidates = home.filter(p=>p !== active);

    candidates.sort((a,b)=>{

        const da = Math.hypot(a.x-ball.x,a.y-ball.y);
        const db = Math.hypot(b.x-ball.x,b.y-ball.y);

        return da-db;

    });

    if(candidates.length){

        active.hasBall = false;

        active = candidates[0];

        updatePositionHUD();

    }

}

function updatePositionHUD(){

    document.getElementById("pos").textContent =
        `${active.pos} · ${active.label}`;

}

/* =========================================================
   BALL POSSESSION
========================================================= */

function giveBall(p){

    if(ball.owner){

        ball.owner.hasBall = false;

    }

    ball.owner = p;

    p.hasBall = true;

    ball.vx = 0;
    ball.vy = 0;

}

/* =========================================================
   PASS
========================================================= */

function passBall(){

    if(!running) return;

    if(ball.owner !== active){

        /*
          If active player isn't holding the ball,
          pressing pass tries to steal/control it.
        */

        const d = Math.hypot(
            active.x-ball.x,
            active.y-ball.y
        );

        if(d < 1.6){

            giveBall(active);

        }

        return;

    }

    const teammates = home.filter(p=>p!==active);

    let target = null;
    let bestScore = -Infinity;

    for(const p of teammates){

        const dx = p.x-active.x;
        const dy = p.y-active.y;

        const dist = Math.hypot(dx,dy);

        if(dist > 14) continue;

        /*
          Prefer forward players and nearby free players.
        */

        let forward = p.x - active.x;

        let score =
            forward * 1.5
            - dist * .55;

        const nearestOpponent =
            Math.min(...away.map(o =>
                Math.hypot(o.x-p.x,o.y-p.y)
            ));

        score += nearestOpponent * .35;

        if(score > bestScore){

            bestScore = score;
            target = p;

        }

    }

    if(!target) return;

    active.hasBall = false;
    ball.owner = null;

    const dx = target.x-active.x;
    const dy = target.y-active.y;

    const d = Math.hypot(dx,dy) || 1;

    const speed = 13;

    ball.x = active.x;
    ball.y = active.y;

    ball.vx = dx/d*speed;
    ball.vy = dy/d*speed;

    ball.passTarget = target;

}

/* =========================================================
   SHOOT
========================================================= */

function shootBall(power){

    if(!running) return;

    if(ball.owner !== active) return;

    const targetGoalX = FIELD_W;

    const goalCenterY = FIELD_H/2;

    let dx = targetGoalX - active.x;
    let dy = goalCenterY - active.y;

    /*
       Slight aim based on joystick.
    */

    if(Math.abs(joyX)+Math.abs(joyY) > .2){

        dx = 1 + joyX * 4;
        dy = joyY * 4;

    }

    const d = Math.hypot(dx,dy) || 1;

    const minPower = 10;
    const maxPower = 22;

    const powerValue =
        minPower +
        (Math.min(power,1) * (maxPower-minPower));

    active.hasBall = false;
    ball.owner = null;

    ball.x = active.x;
    ball.y = active.y;

    ball.vx = dx/d * powerValue;
    ball.vy = dy/d * powerValue;

    ball.passTarget = null;

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function moveActive(dt){

    if(!running) return;

    let x = joyX;
    let y = joyY;

    const mag = Math.hypot(x,y);

    if(mag < .05){

        active.vx *= .85;
        active.vy *= .85;

        return;

    }

    let speed = 4.1;

    if(sprinting && active.stamina > 1){

        speed = 6.5;

        active.stamina -= 19 * dt;

    }else{

        active.stamina += 10 * dt;

    }

    active.stamina =
        Math.max(0,Math.min(100,active.stamina));

    if(active.stamina <= 0){

        sprinting = false;

    }

    if(mag > 1){

        x/=mag;
        y/=mag;

    }

    active.vx = x*speed;
    active.vy = y*speed;

    active.x += active.vx*dt;
    active.y += active.vy*dt;

    /*
       Keep field player inside water.
    */

    active.x =
        Math.max(.7,Math.min(FIELD_W-.7,active.x));

    active.y =
        Math.max(.7,Math.min(FIELD_H-.7,active.y));

}

/* =========================================================
   AI
========================================================= */

function distance(a,b){

    return Math.hypot(a.x-b.x,a.y-b.y);

}

function moveToward(p,targetX,targetY,speed,dt){

    const dx = targetX-p.x;
    const dy = targetY-p.y;

    const d = Math.hypot(dx,dy);

    if(d < .05){

        p.vx*=.8;
        p.vy*=.8;

        return;

    }

    p.vx = dx/d*speed;
    p.vy = dy/d*speed;

    p.x += p.vx*dt;
    p.y += p.vy*dt;

    p.x = Math.max(.7,Math.min(FIELD_W-.7,p.x));
    p.y = Math.max(.7,Math.min(FIELD_H-.7,p.y));

}

function updateHomeAI(p,dt){

    if(p === active) return;

    let tx = p.homeX;
    let ty = p.homeY;

    /*
       Defensive shape.
    */

    if(ball.owner && ball.owner.team === "home"){

        /*
           Attack: move formation slightly forward.
        */

        if(p.pos === "LW" || p.pos === "RW" || p.pos === "CF"){

            tx += 1.5;

        }

    }

    if(ball.owner && ball.owner.team === "away"){

        /*
           Defend: nearest non-GK player closes the ball.
        */

        const d = distance(p,ball);

        if(d < 5 && p.pos !== "TW"){

            tx = ball.x;
            ty = ball.y;

        }

    }

    /*
       If active player is close to another AI,
       maintain spacing.
    */

    const distActive = distance(p,active);

    if(distActive < 1.5){

        const dx = p.x-active.x;
        const dy = p.y-active.y;

        const d = Math.hypot(dx,dy)||1;

        tx += dx/d*1.2;
        ty += dy/d*1.2;

    }

    moveToward(p,tx,ty,2.1,dt);

    /*
       AI receives loose ball.
    */

    if(!ball.owner && distance(p,ball)<.75){

        giveBall(p);

    }

}

function updateAwayAI(p,dt){

    let tx = p.homeX;
    let ty = p.homeY;

    if(ball.owner && ball.owner.team === "home"){

        /*
           Press ball carrier.
        */

        const d = distance(p,ball);

        if(d < 7 && p.pos !== "TW"){

            tx = ball.x;
            ty = ball.y;

        }

    }

    if(ball.owner === p){

        /*
           Attack toward Lok goal.
        */

        tx = 1.5;
        ty = FIELD_H/2;

        /*
           Try to shoot when close enough.
        */

        if(p.x < 6 && Math.abs(p.y-FIELD_H/2)<5){

            p.hasBall = false;

            ball.owner = null;

            const dx = 0.5-p.x;
            const dy = FIELD_H/2-p.y;

            const d = Math.hypot(dx,dy)||1;

            ball.x = p.x;
            ball.y = p.y;

            ball.vx = dx/d*15;
            ball.vy = dy/d*15;

        }

    }

    moveToward(p,tx,ty,2.15,dt);

    /*
       Loose ball pickup.
    */

    if(!ball.owner && distance(p,ball)<.75){

        giveBall(p);

    }

}

/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(dt){

    if(ball.owner){

        const p = ball.owner;

        /*
          Ball sits slightly in front of player.
        */

        let fx = p.vx;
        let fy = p.vy;

        const d = Math.hypot(fx,fy);

        if(d < .1){

            fx = p.team==="home" ? 1 : -1;
            fy = 0;

        }else{

            fx/=d;
            fy/=d;

        }

        ball.x = p.x + fx*.55;
        ball.y = p.y + fy*.55;

        ball.vx = 0;
        ball.vy = 0;

        return;

    }

    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;

    /*
       Water drag.
    */

    ball.vx *= Math.pow(.12,dt);
    ball.vy *= Math.pow(.12,dt);

    /*
       Side walls.
    */

    if(ball.y < .25){

        ball.y=.25;
        ball.vy=Math.abs(ball.vy)*.55;

    }

    if(ball.y > FIELD_H-.25){

        ball.y=FIELD_H-.25;
        ball.vy=-Math.abs(ball.vy)*.55;

    }

    /*
       Left / right wall except goal mouth.
    */

    const inGoalMouth =
        Math.abs(ball.y-FIELD_H/2) < GOAL_W/2;

    if(ball.x < .2 && !inGoalMouth){

        ball.x=.2;
        ball.vx=Math.abs(ball.vx)*.55;

    }

    if(ball.x > FIELD_W-.2 && !inGoalMouth){

        ball.x=FIELD_W-.2;
        ball.vx=-Math.abs(ball.vx)*.55;

    }

    /*
       Pass reception.
    */

    if(ball.passTarget){

        if(distance(ball,ball.passTarget)<.7){

            giveBall(ball.passTarget);

            ball.passTarget=null;

        }

    }

    /*
       Loose-ball pickup.
    */

    if(!ball.owner){

        for(const p of players){

            if(distance(p,ball)<.58){

                giveBall(p);

                break;

            }

        }

    }

}

/* =========================================================
   GOALS
========================================================= */

function checkGoal(){

    if(goalCooldown > 0) return;

    /*
       RIGHT GOAL:
       Guests' goal.
    */

    if(
        ball.x >= FIELD_W + .05 &&
        Math.abs(ball.y-FIELD_H/2) < GOAL_W/2
    ){

        scoreGoal("home");

        return;

    }

    /*
       LEFT GOAL:
       Lok goal.
    */

    if(
        ball.x <= -.05 &&
        Math.abs(ball.y-FIELD_H/2) < GOAL_W/2
    ){

        scoreGoal("away");

    }

}

function scoreGoal(team){

    goalCooldown = 2;

    if(team==="home"){

        homeScore++;

        document.getElementById("homeScore").textContent =
            homeScore;

        showMessage("TOR FÜR LOK! 🟡");

    }else{

        awayScore++;

        document.getElementById("awayScore").textContent =
            awayScore;

        showMessage("TOR GUESTS");

    }

    resetAfterGoal();

}

function resetAfterGoal(){

    ball.owner = null;
    ball.passTarget = null;

    ball.vx = 0;
    ball.vy = 0;

    ball.x = FIELD_W/2;
    ball.y = FIELD_H/2;

    for(const p of players){

        p.hasBall=false;

        p.vx=0;
        p.vy=0;

        p.x=p.homeX;
        p.y=p.homeY;

        p.stamina=Math.min(100,p.stamina+15);

    }

    active = home[5];

    setTimeout(()=>{

        giveBall(active);

    },600);

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(text){

    const el=document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer=setTimeout(()=>{

        el.classList.remove("show");

    },1100);

}

/* =========================================================
   DRAW WATER
========================================================= */

function drawBackground(){

    ctx.clearRect(0,0,W,H);

    /*
       Water background
    */

    const gradient =
        ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#075b85");
    gradient.addColorStop(.5,"#0782ad");
    gradient.addColorStop(1,"#04526f");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);

    /*
       Water waves
    */

    ctx.globalAlpha=.15;

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=1;

    for(let y=100;y<H;y+=22){

        ctx.beginPath();

        for(let x=0;x<W;x+=30){

            ctx.moveTo(x,y);

            ctx.quadraticCurveTo(
                x+8,y-2,
                x+15,y
            );

            ctx.quadraticCurveTo(
                x+22,y+2,
                x+30,y
            );

        }

        ctx.stroke();

    }

    ctx.globalAlpha=1;

}

/* =========================================================
   DRAW FIELD
========================================================= */

function drawField(){

    const s=scale();

    const left=fieldScreenX(0);
    const top=fieldScreenY(0);

    const width=FIELD_W*s;
    const height=FIELD_H*s;

    /*
       Pool surface
    */

    ctx.fillStyle="#0a78a0";

    ctx.fillRect(
        left,
        top,
        width,
        height
    );

    /*
       Subtle inner pool
    */

    ctx.strokeStyle="rgba(255,255,255,.45)";
    ctx.lineWidth=3;

    ctx.strokeRect(
        left,
        top,
        width,
        height
    );

    /*
       Center line
    */

    ctx.beginPath();

    ctx.moveTo(
        fieldScreenX(FIELD_W/2),
        fieldScreenY(0)
    );

    ctx.lineTo(
        fieldScreenX(FIELD_W/2),
        fieldScreenY(FIELD_H)
    );

    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=2;

    ctx.stroke();

    /*
       Center circle
    */

    ctx.beginPath();

    ctx.arc(
        fieldScreenX(FIELD_W/2),
        fieldScreenY(FIELD_H/2),
        2*s,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       Goal areas / 2m line
    */

    ctx.strokeStyle="rgba(255,255,255,.45)";
    ctx.lineWidth=2;

    for(const x of [2,4,26,28]){

        ctx.beginPath();

        ctx.moveTo(
            fieldScreenX(x),
            fieldScreenY(0)
        );

        ctx.lineTo(
            fieldScreenX(x),
            fieldScreenY(FIELD_H)
        );

        ctx.stroke();

    }

    /*
       5m lines
    */

    for(const x of [5,25]){

        ctx.beginPath();

        ctx.moveTo(
            fieldScreenX(x),
            fieldScreenY(0)
        );

        ctx.lineTo(
            fieldScreenX(x),
            fieldScreenY(FIELD_H)
        );

        ctx.stroke();

    }

    /*
       Halfway attack areas
    */

    ctx.fillStyle="rgba(255,255,255,.035)";

    ctx.fillRect(
        fieldScreenX(0),
        fieldScreenY(0),
        5*s,
        FIELD_H*s
    );

    ctx.fillRect(
        fieldScreenX(25),
        fieldScreenY(0),
        5*s,
        FIELD_H*s
    );

    /*
       Goal lines
    */

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        fieldScreenX(0),
        fieldScreenY(FIELD_H/2-GOAL_W/2)
    );

    ctx.lineTo(
        fieldScreenX(0),
        fieldScreenY(FIELD_H/2+GOAL_W/2)
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        fieldScreenX(FIELD_W),
        fieldScreenY(FIELD_H/2-GOAL_W/2)
    );

    ctx.lineTo(
        fieldScreenX(FIELD_W),
        fieldScreenY(FIELD_H/2+GOAL_W/2)
    );

    ctx.stroke();

    drawGoal(0);
    drawGoal(FIELD_W);

}

/* =========================================================
   GOAL DRAW
========================================================= */

function drawGoal(x){

    const s=scale();

    const gx =
        fieldScreenX(x);

    const gy =
        fieldScreenY(FIELD_H/2-GOAL_W/2);

    const gw =
        goalDepth*s;

    const gh =
        GOAL_W*s;

    ctx.fillStyle="rgba(245,245,245,.18)";

    if(x===0){

        ctx.fillRect(
            gx-gw,
            gy,
            gw,
            gh
        );

    }else{

        ctx.fillRect(
            gx,
            gy,
            gw,
            gh
        );

    }

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=3;

    ctx.strokeRect(
        x===0 ? gx-gw : gx,
        gy,
        gw,
        gh
    );

    /*
       Net lines
    */

    ctx.strokeStyle="rgba(255,255,255,.35)";
    ctx.lineWidth=1;

    for(let i=0;i<6;i++){

        const yy =
            gy + gh*i/6;

        ctx.beginPath();

        ctx.moveTo(
            x===0 ? gx-gw : gx,
            yy
        );

        ctx.lineTo(
            x===0 ? gx : gx+gw,
            yy
        );

        ctx.stroke();

    }

}

/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(p){

    const s=scale();

    const x=fieldScreenX(p.x);
    const y=fieldScreenY(p.y);

    const r=.48*s;

    /*
       shadow / water disturbance
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+r*.35,
        r*1.2,
        r*.6,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,20,30,.20)";
    ctx.fill();

    /*
       body
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=p.color;
    ctx.fill();

    /*
       head
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y-r*.55,
        r*.45,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#e8b98c";
    ctx.fill();

    /*
       cap
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y-r*.62,
        r*.42,
        Math.PI,
        0
    );

    ctx.fillStyle=
        p.team==="home"
        ? "#e3bd3b"
        : "#df4256";

    ctx.fill();

    /*
       active ring
    */

    if(p===active){

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r*1.55,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#ffffff";
        ctx.lineWidth=3;

        ctx.stroke();

        /*
           triangle
        */

        ctx.fillStyle="#ffffff";

        ctx.beginPath();

        ctx.moveTo(x,y-r*2.1);
        ctx.lineTo(x-5,y-r*1.5);
        ctx.lineTo(x+5,y-r*1.5);
        ctx.closePath();

        ctx.fill();

    }

    /*
       ball possession marker
    */

    if(p.hasBall){

        ctx.beginPath();

        ctx.arc(
            x+r*.8,
            y-r*.5,
            r*.27,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffffff";
        ctx.fill();

    }

}

/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    const s=scale();

    const x=fieldScreenX(ball.x);
    const y=fieldScreenY(ball.y);

    const r=Math.max(3,ball.radius*s);

    /*
       shadow
    */

    ctx.beginPath();

    ctx.ellipse(
        x+2,
        y+3,
        r*1.15,
        r*.65,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.fill();

    /*
       ball
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffffff";
    ctx.fill();

    ctx.strokeStyle="#222";
    ctx.lineWidth=1;

    ctx.stroke();

}

/* =========================================================
   TIMER
========================================================= */

let secondAccumulator=0;

function updateClock(dt){

    secondAccumulator += dt;

    if(secondAccumulator >= 1){

        secondAccumulator-=1;

        if(gameSeconds>0){

            gameSeconds--;

        }else{

            running=false;

            showMessage("SPIEL ENDE");

        }

    }

    const minutes =
        Math.floor(gameSeconds/60);

    const seconds =
        gameSeconds%60;

    document.getElementById("clock").textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

/* =========================================================
   SHOOT CHARGE
========================================================= */

function updateShotCharge(dt){

    if(shooting){

        shotCharge += dt*.9;

        shotCharge =
            Math.min(1,shotCharge);

    }

}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!running) return;

    if(goalCooldown>0){

        goalCooldown-=dt;

    }

    moveActive(dt);

    /*
       AI
    */

    for(const p of home){

        updateHomeAI(p,dt);

    }

    for(const p of away){

        updateAwayAI(p,dt);

    }

    /*
       Ball
    */

    updateBall(dt);

    checkGoal();

    updateClock(dt);

    updateShotCharge(dt);

    /*
       Active player stamina recovery
    */

    if(!sprinting){

        active.stamina += 6*dt;

        active.stamina =
            Math.min(100,active.stamina);

    }

    document.getElementById("stamina").style.width =
        active.stamina+"%";

}

/* =========================================================
   RENDER
========================================================= */

function render(){

    drawBackground();

    drawField();

    /*
       Draw players sorted by y
       so depth feels more natural.
    */

    const sorted =
        [...players].sort((a,b)=>a.y-b.y);

    for(const p of sorted){

        drawPlayer(p);

    }

    drawBall();

}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

    const dt =
        Math.min(.033,(now-lastTime)/1000);

    lastTime=now;

    update(dt);

    render();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

/* =========================================================
   START GAME
========================================================= */

document.getElementById("startButton")
.addEventListener("click",startGame);

function startGame(){

    document.getElementById("startScreen")
        .style.display="none";

    running=true;

    gameSeconds=240;

    homeScore=0;
    awayScore=0;

    document.getElementById("homeScore")
        .textContent="0";

    document.getElementById("awayScore")
        .textContent="0";

    active=home[5];

    updatePositionHUD();

    resetAfterGoal();

}

/* =========================================================
   DESKTOP / DEBUG KEYBOARD
========================================================= */

const keyboard={};

addEventListener("keydown",e=>{

    keyboard[e.key.toLowerCase()]=true;

    if(e.key===" "){
        e.preventDefault();
    }

});

addEventListener("keyup",e=>{

    keyboard[e.key.toLowerCase()]=false;

});

function keyboardControls(){

    /*
       Extra controls for testing on a computer.
       Phone controls remain the main controls.
    */

    if(!running) return;

    let x=0;
    let y=0;

    if(keyboard["a"] || keyboard["arrowleft"]) x-=1;
    if(keyboard["d"] || keyboard["arrowright"]) x+=1;
    if(keyboard["w"] || keyboard["arrowup"]) y-=1;
    if(keyboard["s"] || keyboard["arrowdown"]) y+=1;

    if(x || y){

        const d=Math.hypot(x,y);

        joyX=x/d;
        joyY=y/d;

    }

    if(keyboard["shift"]){

        sprinting=true;

    }else if(
        !joystickPointer
    ){

        sprinting=false;

    }

}

setInterval(keyboardControls,30);

/* =========================================================
   Prevent scrolling / browser gestures
========================================================= */

document.addEventListener("touchmove",e=>{

    e.preventDefault();

},{passive:false});

document.addEventListener("gesturestart",e=>{

    e.preventDefault();

},{passive:false});

</script>
